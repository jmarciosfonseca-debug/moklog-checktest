<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#04080f" />
    <meta name="description" content="MokLog CheckTest - Sistema de Teste Semanal de Segurança" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MokLog" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="icon" href="%PUBLIC_URL%/icon-192.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="%PUBLIC_URL%/icon-512.png" />
    <title>MokLog CheckTest</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #04080f; color: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
      input, select, textarea, button { font-family: inherit; }
      /* botões sem fundo/cor próprios herdam a cor do tema (ícones de linha deixavam de ficar pretos no escuro) */
      button:not([style*="background"]):not([style*="color"]) { color: inherit; }
      /* acabamento dos ícones de linha: halo suave na própria cor (removido nos temas claros) */
      svg.mk-ico { filter: drop-shadow(0 0 1.6px color-mix(in srgb, currentColor 55%, transparent)); }
      button { transition: opacity .15s ease, transform .1s ease, background-color .15s ease; touch-action: manipulation; }
      button:active:not(:disabled) { opacity: .8; transform: scale(.98); }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }
      @keyframes mkTela { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      #root > * { animation: mkTela .18s ease-out; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
