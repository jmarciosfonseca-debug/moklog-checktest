rrências ao finalizar."], ["Imediatamente e após"]], ["CDA / Recepção", ["Manter-se atento com porta trancada e cumprir orientações da liderança."], ["Durante toda a ocorrência"]]], "kind": "crise"}, {"t": "table", "title": "Queda de Energia Elétrica", "hdr": ["Função / Posto", "Ação esperada", "Quando"], "rows": [["VSPP Líder", ["Alertar toda a equipe imediatamente.", "Checar o gerador e constatar a extensão da queda de energia.", "Acionar o manutencista ao confirmar a falha.", "Informar Moked, Supervisão, usuários e Gerente imediatamente.", "Atentar a acessos e rondas, já que equipamentos automáticos podem ser afetados."], ["Imediatamente"]], ["VSPP Apoio/Ronda", ["Redobrar atenção nas rondas e acessos — portões automáticos e catracas podem falhar.", "Seguir as recomendações do Líder conforme a situação se desenvolve."], ["Imediatamente"]], ["Vigilante de CCO", ["Entrar em contato com a concessionária: ENEL SP 0800-72-72-120.", "Verificar visualmente se todos os geradores foram acionados e checar a cabine primária.", "Se há energia da concessionária: ligar para o plantão da Alamo solicitando atendimento.", "Se não há energia da concessionária: aguardar restabelecimento antes de acionar empresa de manutenção.", "Manter comunicação constante com Moked, Supervisão e Gerência durante todo o período.", "Relatar no Livro de Ocorrências ao finalizar, incluindo horários de interrupção e normalização."], ["Imediatamente"]], ["CDA / Recepção", ["Manter atendimento normal e cumprir orientações da liderança. Atentar para o sistema Accelero."], ["Durante toda a ocorrência"]]], "kind": "crise"}, {"t": "table", "title": "Inundação", "hdr": ["Função / Posto", "Ação esperada", "Quando"], "rows": [["VSPP Líder", ["Alertar imediatamente toda a equipe de segurança.", "Orientar e manter os usuários em área segura durante a ocorrência.", "Informar Moked e Supervisão ao tomar conhecimento.", "Priorizar a segurança das pessoas antes de qualquer outro procedimento."], ["Imediatamente"]], ["VSPP Apoio/Ronda", ["Aguardar as orientações do Líder.", "Resguardar vidas como prioridade máxima.", "Auxiliar na condução dos usuários para áreas seguras."], ["Imediatamente"]], ["Vigilante de CCO", ["Acionar a manutenção do condomínio imediatamente após confirmação da situação.", "Monitorar a área afetada via CFTV e informar o Líder sobre a evolução.", "Preservar e salvar as imagens ao encerramento da ocorrência."], ["Imediatamente e após"]], ["CDA / Recepção", ["Manter-se atento e cumprir orientações da liderança."], ["Durante toda a ocorrência"]]], "kind": "crise"}, {"t": "table", "title": "Vazamento de Gás", "hdr": ["Função / Posto", "Ação esperada", "Quando"], "rows": [["VSPP Líder", ["Alertar toda a equipe imediatamente.", "Identificar o local suspeito realizando verificação nas áreas de estoque de gás.", "Orientar os usuários a procurar local seguro e bem ventilado.", "Proibir uso de faíscas, equipamentos elétricos ou chamas próximos ao local suspeito.", "Informar Moked, Supervisão e Gerente ao tomar conhecimento e ao finalizar."], ["Imediatamente"]], ["VSPP Apoio/Ronda", ["Seguir as recomendações do VSPP Líder. Auxiliar na orientação dos usuários."], ["Imediatamente"]], ["Vigilante de CCO", ["Acionar a manutenção do condomínio e a empresa de gás imediatamente.", "Checar as imagens do CFTV no local.", "Gravar imagens para arquivo e relatar no Livro de Ocorrências ao finalizar."], ["Imediatamente e após"]], ["CDA / Recepção", ["Manter-se atento e cumprir orientações da liderança."], ["Durante toda a ocorrência"]]], "kind": "crise"}, {"t": "table", "title": "Incêndio (Área Interna)", "hdr": ["Função / Posto", "Ação esperada", "Quando"], "rows": [["VSPP Líder", ["Alertar toda a equipe via rádio HT imediatamente.", "Combater o princípio de incêndio com extintor, se seguro e treinado para tal.", "Manter os usuários em local seguro e afastado do foco.", "Coordenar a evacuação quando necessário, direcionando aos pontos de reunião.", "Informar Moked, Supervisão e Gerente ao tomar conhecimento."], ["Imediatamente"]], ["VSPP Apoio/Ronda", ["Seguir as recomendações do Líder.", "Dispersar pessoas da área afetada.", "Guardar uma eclusa livre para o acesso do Corpo de Bombeiros.", "Bloquear acessos de veículos para não obstruir a via dos bombeiros."], ["Imediatamente"]], ["Vigilante de CCO", ["Acionar o Corpo de Bombeiros via 193, informando endereço, número do galpão e situação.", "Checar as imagens do CFTV no local da ocorrência.", "Gravar imagens para arquivo e relatar no Livro de Ocorrências ao finalizar."], ["Imediatamente e após"]], ["CDA / Recepção", ["Manter-se atento com porta segura. Cumprir orientações da liderança e orientar a brigada."], ["Durante toda a ocorrência"]]], "kind": "crise"}, {"t": "table", "title": "Incêndio (Área Externa)", "hdr": ["Função / Posto", "Ação esperada", "Quando"], "rows": [["VSPP Líder", ["Alertar toda a equipe imediatamente.", "Reforçar a vigilância nas áreas críticas adjacentes ao foco externo.", "Manter os usuários internos em local seguro, longe das áreas próximas ao fogo.", "Informar Moked, Supervisão e Gerente ao tomar conhecimento."], ["Imediatamente"]], ["VSPP Apoio/Ronda", ["Seguir as diretrizes do Líder.", "Manter posição e realizar rondas preventivas internas.", "Não se expor ao incêndio externo sem orientação."], ["Imediatamente"]], ["Vigilante de CCO", ["Acionar o Corpo de Bombeiros via 193.", "Checar as imagens do CFTV no local, monitorar evolução do fogo.", "Gravar imagens para arquivo e relatar no Livro de Ocorrências ao finalizar."], ["Imediatamente e após"]], ["CDA / Recepção", ["Manter-se atento com porta segura e cumprir orientações da liderança."], ["Durante toda a ocorrência"]]], "kind": "crise"}, {"t": "table", "title": "Uso de Entorpecentes (Área Externa)", "hdr": ["Função / Posto", "Ação esperada", "Quando"], "rows": [["VSPP Líder", ["Alertar toda a equipe e ficar atento à situação sem se expor desnecessariamente.", "Não abordar diretamente os usuários de drogas — acionar a Polícia. – (Área Interna) Abordar.", "Informar Moked, Supervisão e Gerente ao tomar conhecimento e ao finalizar."], ["Imediatamente"]], ["VSPP Apoio/Ronda", ["Seguir as diretrizes do VSPP Líder. Monitorar a situação sem confronto – (Área Interna) Abordar."], ["Imediatamente"]], ["Vigilante de CCO", ["Acionar 190 imediatamente.", "Checar as imagens do CFTV no local.", "Gravar imagens para arquivo e relatar no Livro de Ocorrências ao finalizar."], ["Imediatamente e após"]], ["CDA / Recepção", ["Manter-se atento e cumprir orientações da liderança."], ["Durante toda a ocorrência"]]], "kind": "crise"}, {"t": "table", "title": "Espionagem por Drone", "hdr": ["Função / Posto", "Ação esperada", "Quando"], "rows": [["VSPP Líder", ["Alertar toda a equipe imediatamente.", "Fotografar o drone durante o voo sobre o centro logístico com o maior zoom disponível.", "Tentar identificar o local de pouso quando o drone se afastar.", "Não tentar derrubar o drone — registrar e reportar.", "Informar Moked e Administração ao finalizar e relatar no Livro de Ocorrências."], ["Imediatamente"]], ["VSPP Apoio/Ronda", ["Seguir as diretrizes do VSPP Líder. Auxiliar na observação e registro."], ["Imediatamente"]], ["Vigilante de CCO", ["Checar as imagens do CFTV e rastrear o trajeto do drone.", "Gravar toda a ocorrência para arquivo.", "Relatar no Livro de Ocorrências ao finalizar."], ["Durante e após"]], ["CDA / Recepção", ["Manter-se atento e cumprir orientações da liderança."], ["Durante toda a ocorrência"]]], "kind": "crise"}, {"t": "table", "title": "Manifestações / Áreas Comuns", "hdr": ["Função / Posto", "Ação esperada", "Quando"], "rows": [["VSPP Líder", ["Resguardar os usuários internos e concentrar a equipe dentro do perímetro do KLOG.", "Coordenar o fechamento de barreiras físicas nos acessos somente após aprovação da Moked.", "Manter-se dentro do perímetro durante toda a ocorrência.", "Não confrontar nem provocar os manifestantes em nenhuma hipótese."], ["Imediatamente"]], ["VSPP Apoio/Ronda", ["Aguardar as diretrizes da liderança. Manter posição e não se expor aos manifestantes."], ["Durante toda a ocorrência"]], ["Vigilante de CCO", ["Acionar o Plano de Chamadas imediatamente.", "Monitorar a manifestação via CFTV, informando qualquer novidade à equipe.", "Checar e gravar as imagens para arquivo.", "Relatar o fato no Livro de Ocorrências de forma minuciosa ao finalizar."], ["Imediatamente e após"]], ["CDA / Recepção", ["Manter-se atento com porta segura e cumprir orientações da liderança."], ["Durante toda a ocorrência"]]], "kind": "crise"}, {"t": "table", "title": "Queda de Balão", "hdr": ["Função / Posto", "Ação esperada", "Quando"], "rows": [["VSPP Líder", ["Identificar o local onde o balão caiu dentro ou próximo ao empreendimento.", "Coordenar a equipe para evitar que outras pessoas acessem a área para resgatar o balão — resgatar balão aceso é crime.", "Solicitar que o Moto Ronda se desloque para recolher o balão e apagar a cangalha se possível.", "Manter contato com a Administração atualizando as informações."], ["Imediatamente"]], ["VSPP Apoio/Ronda", ["Manter acessos bloqueados momentaneamente na área do incidente.", "Reforçar apoio nas vias de acesso e nas rondas durante e após a ocorrência."], ["Imediatamente e após"]], ["Vigilante de CCO", ["Monitorar via CFTV e apoiar o Moto Ronda via rádio.", "Se o Moto Ronda não conseguir apagar a cangalha, solicitar apoio imediatamente.", "Se terceiros tentarem resgatar o balão: acionar 190.", "Gravar toda a ocorrência e registrar no Livro de Ocorrências."], ["Durante e após"]], ["CDA / Recepção", ["Manter-se atento e cumprir orientações da liderança."], ["Durante toda a ocorrência"]]], "kind": "crise"}, {"t": "h", "num": "5.4", "title": "Ameaça de Bomba", "lvl": 2}, {"t": "p", "text": "Ver também: Capítulo 6.1 — Instrução sobre Ameaça de Bomba e Anexo 7.2 — Formulário de Ameaça Telefônica."}, {"t": "card", "title": "Ameaça por Telefone", "rows": [{"label": "NGA", "items": ["O VSPP Líder, tático ou porteiro, ao atender chamada telefônica de ameaça ou telefonema suspeito, deverá manter a calma e a sobriedade. É crucial manter o agressor na ligação pelo maior tempo possível para obter informações e identificar o local da chamada."]}, {"label": "POP", "items": ["1. Manter o agressor na linha pelo maior tempo possível.", "2. Observar e anotar: característica da voz (tom, sotaque, gírias), estado emocional, ruídos ao fundo.", "3. Questionar: quando a bomba vai explodir? Onde está localizada? Tamanho e material? Código de desativação? Por quê?", "4. Comunicar imediatamente o VSPP Líder e o CCO via rádio, sem desligar o telefone.", "5. Após ser autorizado pelo superior: acionar a Polícia (190) e a Moked.", "6. Preencher imediatamente o formulário de ameaça anônima (Anexo 7.2), com todos os dados da chamada.", "7. O CCO deve registrar todo fato ocorrido e realizar buscas via CFTV para identificar o causador."]}, {"label": "Observações", "items": ["Estas orientações são procedimentos preventivos. O objetivo é preparar a equipe para agir de forma correta e coordenada caso a situação ocorra. Não se trata de situação real ou iminente."]}]}, {"t": "card", "title": "Artefato Suspeito Identificado Visualmente", "rows": [{"label": "NGA", "items": ["Não tocar, mover, examinar ou se aproximar do objeto em hipótese alguma. A segurança de todos depende de preservar a cena intacta até a chegada das autoridades especializadas."]}, {"label": "POP", "items": ["1. Informar imediatamente toda a equipe e a Administração.", "2. Fotografar o objeto com zoom máximo, sem se aproximar.", "3. Isolar a área com o maior raio de segurança possível — afastar todas as pessoas.", "4. Acionar Polícia (190) e GATE — Grupo de Ações Táticas Especiais (via 190 ou Corpo de Bombeiros 193).", "5. Iniciar evacuação da área conforme plano de abandono.", "6. CCO: registrar o fato, salvar imagens e buscar no CFTV o responsável pelo depósito do artefato."]}]}, {"t": "h", "num": "5.5", "title": "Greve ou Manifestação", "lvl": 2}, {"t": "p", "text": "Ver também: Capítulo 6.1 — Instrução sobre Greve ou Protesto."}, {"t": "p", "text": "A atuação da segurança patrimonial em situações de greve ou protesto deve considerar que a greve é um direito legal, regulado por legislação específica. O empregado que adere à greve, nos termos da lei, não pode ser impedido de exercer esse direito. A abordagem deve ser sempre de contenção, monitoramento e registro — nunca de confronto."}, {"t": "table", "title": null, "hdr": ["Papel", "O que fazer", "O que NÃO fazer"], "rows": [["VSPP Líder", ["Dialogar com manifestantes de forma serena e respeitosa, se necessário.", "Acionar Moked, Supervisão e Administração imediatamente.", "Coordenar o fechamento de barreiras físicas somente após aprovação da Moked."], ["Confrontar ou provocar os manifestantes.", "Tomar decisões sem consultar superiores."]], ["VSPP Apoio", ["Ficar em posição de contenção, prestar apoio se necessário.", "Seguir orientações do Líder."], ["Entrar em conflito com os protestantes.", "Agir por conta própria."]], ["Vigilante de CCO", ["Acionar o Plano de Chamadas.", "Manter todos informados.", "Registrar imagens como evidência.", "Acionar forças de segurança pública se necessário."], ["Ignorar ou minimizar a situação."]], ["CDA / Recepção", ["Manter todos os envolvidos internos informados.", "Aguardar instruções para eventual acionamento de equipes de emergência."], ["Abrir acesso a manifestantes sem autorização."]]], "kind": "greve"}, {"t": "ul", "items": ["Estabelecer um plano de comunicação eficaz entre equipe, Moked e Administração.", "Identificar e avaliar os riscos potenciais para o empreendimento e seus usuários.", "Avaliar a ameaça e evitar entrar em conflito com os protestantes.", "Salvar imagens como evidências de ocorrências.", "Preparar relatório minucioso dos fatos ao encerrar."]}, {"t": "h", "num": "6", "title": "Treinamentos e Instruções", "lvl": 1}, {"t": "h", "num": "6.1", "title": "Conteúdo das Instruções", "lvl": 2}, {"t": "p", "text": "Os treinamentos são aplicados periodicamente à equipe da Haganá para o KLOG Guarulhos. O objetivo é garantir que todos os profissionais estejam preparados para agir de forma correta, rápida e coordenada em cada cenário. Para os procedimentos operacionais detalhados, consulte os Capítulos indicados em cada tema."}, {"t": "h", "num": "Tema 1", "title": "Ameaça de Bomba", "lvl": 3}, {"t": "p", "text": "Referência neste Manual: Cap. 5.4 — Ameaça de Bomba | Anexo 7.2 — Formulário de Ameaça Telefônica O VSPP Líder, ao atender uma chamada telefônica de ameaça ou telefonema suspeito, deverá manter a calma e a sobriedade. É importante tentar obter informações do agressor, tais como:"}, {"t": "ul", "items": ["Características da voz: como ele fala, se usa gírias, sotaques, ruídos ao fundo.", "Motivo da ameaça e detalhes sobre o alvo.", "Quando, onde e como seria a explosão. É crucial manter o agressor na ligação pelo maior tempo possível para identificar o local da chamada. Informar imediatamente o superior e, após ser autorizado, acionar a Polícia. Em caso de ameaça por telefone, questionar:", "Quando a bomba vai explodir?", "Onde a bomba está localizada?", "Qual é o tamanho e o material da bomba?", "Quais são as consequências possíveis se explodir?", "Há algum código ou senha para desativá-la? Em caso de identificação visual de artefato suspeito:", "Informar imediatamente toda a equipe e a Administração.", "Fotografar o objeto com zoom, sem se aproximar.", "Isolar a área e aguardar instrução das autoridades.", "Acionar as forças de segurança pública e dar o alerta de evacuação. O Vigilante de CCO deve registrar todo fato ocorrido e realizar buscas via CFTV para identificar o causador."]}, {"t": "h", "num": "Tema 2", "title": "Invasão Perimetral", "lvl": 3}, {"t": "p", "text": "Referência neste Manual: Cap. 5.3 — Roteiro: Invasão Perimetral Em caso de invasão perimetral, a equipe deve ativar o alerta máximo de atenção. Há uma situação de crise instaurada e será necessário que a equipe esteja preparada para agir de forma coordenada. Vigilante de CCO:"}, {"t": "ul", "items": ["Identificar a invasão via CFTV imediatamente.", "Acionar 190, informando que o projeto possui vigilância armada.", "Acompanhar a ocorrência via CFTV, dando suporte e orientação ao Líder.", "Gravar as imagens para arquivo ao finalizar."]}, {"t": "ul", "items": ["Relatar os fatos no Livro de Ocorrências de forma minuciosa. VSPP Líder:", "Alertar a equipe imediatamente.", "Informar a Moked e a Supervisão.", "Combater o invasor utilizando as técnicas TTI (quando necessário, em extrema iminência).", "Informar ao Gerente do Empreendimento.", "Relatar os fatos de forma minuciosa no RS. Princípios durante a crise: comunicação clara e transparente, avaliação contínua da situação, coordenação efetiva de papéis e responsabilidades, e cuidado com a segurança de todos como prioridade máxima. Após resolução da crise: conduzir análise do que funcionou, do que falhou e como melhorar para o futuro."]}, {"t": "h", "num": "Tema 3", "title": "Greve ou Protesto", "lvl": 3}, {"t": "p", "text": "Referência neste Manual: Cap. 5.5 — Greve ou Manifestação A atuação da segurança em situações de greve ou protesto deve considerar que a greve é um direito legal regulado por legislação específica. A equipe deve estar preparada para lidar com situações tanto externas quanto internas, respeitando o direito de expressão dos envolvidos e preservando a ordem e a segurança do empreendimento. O VSPP Líder, se houver necessidade, deve dialogar com os manifestantes de forma serena. O VSPP Apoio deve ficar em posição de contenção. O CCO deve manter todos informados e registrar imagens. O que não deve ser feito:"}, {"t": "ul", "items": ["Não confrontar ou provocar os manifestantes.", "Não ignorar ou minimizar as preocupações dos manifestantes.", "Não tomar decisões sem consultar os superiores. Em protesto ou manifestação: identificar os envolvidos, avaliar a ameaça ao empreendimento, acionar a Moked e a Supervisão, acionar forças públicas se necessário e salvar imagens como evidência."]}, {"t": "h", "num": "Tema 4", "title": "Controle de Acesso", "lvl": 3}, {"t": "p", "text": "Referência neste Manual: Cap. 4.2 — Controle de Acesso | Cap. 3.2.1 — Sistema Accelero A equipe possui treinamento sobre o sistema Accelero (acesso 100% facial). Tanto a equipe de segurança quanto o controlador de acesso têm conhecimento sobre o funcionamento do sistema para cadastro e liberação de acessos. Pontos críticos do cadastro:"}, {"t": "ul", "items": ["Preenchimento correto dos dados: nome completo e CPF obrigatórios.", "Se o acesso for com veículo: a placa é obrigatória.", "A fotografia facial é obrigatória: retirar boné, óculos escuros e qualquer acessório que cubra o rosto.", "Após o cadastro, o acesso é liberado automaticamente pela facial na catraca ou cancela. Plano B — em caso de falha no sistema Accelero:"]}, {"t": "ul", "items": ["Utilizar planilhas impressas para registro manual: nome, CPF, placa, empresa, horário de entrada e saída.", "Definir responsável por cada tarefa: orientar usuários, verificar autorizações, controlar entradas/saídas e arquivar as planilhas.", "Armazenar as planilhas em local seguro para posterior digitalização e envio. O que não deve ser feito:", "Não ignorar erros de acesso — sempre reportar e registrar.", "Não deixar de seguir o Plano B em caso de falha no sistema.", "Não criar cadastro duplicado sem buscar o existente primeiro."]}, {"t": "h", "num": "Tema 5", "title": "Ação em Caso de Incêndio", "lvl": 3}, {"t": "p", "text": "Referência neste Manual: Cap. 5.3 — Roteiros: Incêndio (Área Interna e Externa) | Cap. 5.2 — Abandono Este treinamento aborda as medidas imediatas que a equipe deve tomar em caso de foco de incêndio, com o objetivo de garantir a integridade física de todos. Após um alarme no painel SDAI, a CDA/Recepção deve acionar imediatamente o Líder para checagem. É fundamental que a equipe saiba interpretar as informações do SDAI para uma resposta rápida. Procedimentos imediatos:"}, {"t": "ul", "items": ["Manter a calma e iniciar a evacuação.", "Orientar os colaboradores sobre o ponto de reunião externo.", "Ligar para o Corpo de Bombeiros (193): informar endereço, número do galpão e situação do incêndio.", "Não tentar apagar o fogo sozinho, a menos que seja seguro e que você tenha treinamento para tal.", "Utilizar as rotas de fuga — as cancelas são as mais indicadas pelo grande fluxo de pessoas.", "Não permitir que veículos acessem o condomínio durante a evacuação.", "Orientar os usuários a não retornar ao galpão até autorização dos Bombeiros. O que não fazer:", "Não tentar apagar incêndio fora de controle — isso pode colocar vidas em risco.", "Não usar elevadores durante a evacuação.", "Não bloquear saídas de emergência — devem estar sempre livres.", "Não retornar ao galpão até liberação dos Bombeiros. O KLOG Guarulhos conta com Brigada de Incêndio treinada, composta por representantes dos inquilinos. A equipe de segurança deve conhecer os brigadistas e atuar de forma coordenada com eles. Recomenda-se elaboração de plano de evacuação detalhado com saídas, locais seguros e procedimentos para ocorrências de grande proporção."]}, {"t": "h", "num": "Tema 6", "title": "Emergência Médica", "lvl": 3}, {"t": "p", "text": "Referência neste Manual: Cap. 5.3 — Roteiros: Acidente Interno com Vítimas Centros logísticos são locais onde ocorrem diversas atividades que envolvem equipamentos, veículos, máquinas e grande movimentação de pessoas. Uma emergência médica é qualquer situação que requer intervenção imediata para preservar a vida ou evitar complicações graves."}, {"t": "p", "text": "Tipos de emergência mais comuns neste ambiente:"}, {"t": "ul", "items": ["Parada cardiorrespiratória, choque elétrico, queimaduras.", "Fraturas, ferimentos cortantes, intoxicações.", "Desmaios, convulsões, crises hipertensivas.", "Acidentes com animais peçonhentos, acidentes com veículos. Procedimento:", "Manter a calma e avaliar a cena: verificar riscos para você, para a vítima e para outras pessoas.", "Acionar o Bombeiro civil residente no condomínio pelo rádio ou telefone (número a confirmar com a Administração).", "Informar a Administração sobre a ocorrência pelo telefone ou rádio.", "Chamar o SAMU (192) ou Bombeiros (193): informar local, número de vítimas, estado de consciência e gravidade.", "Proteger a vítima: aconchego, calor, proteção de curiosos. Conversar e tentar acalmar até a chegada do socorro.", "Não abandonar a vítima em hipótese alguma até a chegada do resgate.", "Facilitar o acesso da ambulância: sinalizar o local com cones, fitas ou placas.", "Registrar a ocorrência em RS detalhado e entregar à Administração. O que não fazer:", "Não mover a vítima a menos que absolutamente necessário — pode agravar os ferimentos.", "Não dar nada para a vítima beber ou comer — pode interferir no tratamento médico.", "Não realizar procedimentos médicos para os quais não foi treinado. Kit de Primeiros Socorros: a equipe de segurança deve conhecer a localização do kit e disponibilizar os itens conforme a emergência. Composição recomendada: prancha, kit de talas, maca, colar cervical, luvas descartáveis, garrote e bandagens."]}, {"t": "h", "num": "6.2", "title": "Registro de Treinamento", "lvl": 2}, {"t": "p", "text": "Ao final de cada sessão de instrução, o responsável deve preencher e assinar o registro abaixo. Um arquivo PDF das instruções será compartilhado com a equipe para leitura e aprimoramento."}, {"t": "table", "title": "Registro de Instrução Aplicada — P505 / KLOG Guarulhos", "hdr": ["Campo", "Preenchimento"], "rows": [["P505 — Turno da Equipe", []], ["VSPP Líder", []], ["VSPP Apoio/Ronda (1)", []], ["VSPP Apoio/Ronda (2)", []], ["Vigilante de CCO", []], ["CDA / Recepção", []], ["Data Registro de Instrução Aplicada — P505 / KLOG Guarulhos", ["_____ / _____ / _______"]], ["Local", ["KLOG Guarulhos — P505, Rua Indubel, 940 — Guarulhos/SP"]], ["Sup $('#q').addEventListener('keydown',e=>{if(e.key==='Escape'){R.classList.remove('on');$('#q').blur();return}if(!last.length)return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+last.length)%last.length;R.querySelectorAll('.rr').forEach((r,i)=>r.classList.toggle('sel',i===sel));R.querySelector('.rr.sel').scrollIntoView({block:'nearest'})}if(e.key==='Enter'){e.preventDefault();abrir(last[sel])}});
R.addEventListener('click',e=>{const r=e.target.closest('.rr');if(r){e.preventDefault();abrir(last[+r.dataset.i])}});
function abrir(it){R.classList.remove('on');$('#q').blur();go(it.id)}
document.addEventListener('click',e=>{if(!e.target.closest('.sw'))R.classList.remove('on')});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('#q').focus()}});
// ---------- emergência ----------
function abrirCen(){$('#cen').classList.add('on');$('#cf').value='';fcen();setTimeout(()=>$('#cf').focus(),50)}
function fcen(){const f=norm($('#cf').value);const toks=f.split(/\s+/).filter(Boolean).map(expand);$('#cg').innerHTML=crises.filter(c=>{const n=norm(c.title);return toks.every(a=>a.some(t=>n.includes(t)))}).map(c=>`<button class="gt" data-id="${c.id}">${esc(c.title)}</button>`).join('')||'<p>Nenhum cenário com esse termo.</p>'}
$('#bcen').onclick=abrirCen;$('#cx').onclick=()=>$('#cen').classList.remove('on');$('#cf').oninput=fcen;
$('#cg').addEventListener('click',e=>{const b=e.target.closest('.gt');if(b){$('#cen').classList.remove('on');go(b.dataset.id)}});
$('#cen').addEventListener('click',e=>{if(e.target.id==='cen')$('#cen').classList.remove('on')});
// ---------- tema ----------
function tema(t){document.documentElement.dataset.t=t;try{localStorage.setItem('mnp-t',t)}catch(_){}}
(function(){let t=null;try{t=localStorage.getItem('mnp-t')}catch(_){}tema(t||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))})();
$('#bth').onclick=()=>tema(document.documentElement.dataset.t==='dark'?'light':'dark');
// hash inicial
if(location.hash.length>1)setTimeout(()=>go(decodeURIComponent(location.hash.slice(1))),300);
</script>
</body></html>
