<!doctype html>
<html lang="pt-BR">
<head>

<title>MNP P505 — KLOG Guarulhos</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--navy:#0d2240;--navy2:#16315c;--or:#e87722;--bg:#f4f6fa;--card:#fff;--ink:#16202f;--mut:#5b6678;--line:#dbe1ea;--nga:#e3ecf8;--ngaink:#173a6b;--pop:#fff1e0;--popink:#8a4208;--obs:#eef0f3;--att:#fdeaea;--attink:#8c1d1d;--hl:#ffe58a;--rad:14px;--sh:0 1px 2px rgba(13,34,64,.06),0 6px 20px rgba(13,34,64,.06)}
:root[data-t=dark]{--bg:#0a1220;--card:#111c30;--ink:#e6ecf5;--mut:#9aa7bd;--line:#223452;--nga:#14294a;--ngaink:#a9c8f5;--pop:#2b1d0f;--popink:#ffc58a;--obs:#17233a;--att:#341618;--attink:#ffb3b3;--hl:#6b5a12;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.25)}
header .ttl{font-weight:800;font-size:14px;line-height:1.15;white-space:nowrap}header .ttl small{display:block;font-weight:500;opacity:.75;font-size:11px}
.btn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:8px 10px;cursor:pointer;font:600 13px inherit;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:rgba(255,255,255,.2)}.btn.or{background:var(--or);border-color:var(--or)}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sw{flex:1;position:relative;min-width:0}
#q{width:100%;border-radius:11px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;padding:10px 12px 10px 36px;font:500 15px inherit;outline:none}
#q::placeholder{color:rgba(255,255,255,.65)}#q:focus{background:#fff;color:#16202f}#q:focus::placeholder{color:#7a8597}
.sw svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;pointer-events:none}
#q:focus~svg{stroke:#475569}
#res{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.35);max-height:70vh;overflow:auto;display:none}
#res.on{display:block}.rr{display:block;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;text-decoration:none;color:inherit}
.rr:last-child{border:0}.rr.sel,.rr:hover{background:var(--nga)}.rr b{font-size:14px}.rr .path{font-size:11px;color:var(--mut);letter-spacing:.2px}.rr p{margin:3px 0 0;font-size:13px;color:var(--mut)}
.rt{padding:8px 14px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;background:var(--obs)}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.wrap{display:grid;grid-template-columns:290px minmax(0,1fr);max-width:1280px;margin:0 auto}
nav#toc{position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow:auto;padding:16px 10px 40px 16px;font-size:13.5px}
nav#toc a{display:block;padding:5px 9px;border-radius:8px;color:var(--mut);text-decoration:none;border-left:2px solid transparent}
nav#toc a.l1{font-weight:800;color:var(--ink);margin-top:10px;text-transform:uppercase;font-size:12px;letter-spacing:.5px}
nav#toc a.l2{padding-left:16px}nav#toc a.l3{padding-left:30px;font-size:12.5px}
nav#toc a:hover{background:var(--nga)}nav#toc a.on{background:var(--nga);color:var(--ngaink);border-left-color:var(--or);font-weight:700}
main{padding:20px 18px 80px;min-width:0}
.cover{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:var(--rad);padding:24px;box-shadow:var(--sh)}
.cover h1{margin:0 0 4px;font-size:26px;letter-spacing:-.3px}.cover h2{margin:0;color:var(--or);font-size:18px}.cover p{margin:6px 0 0;opacity:.8;font-size:13px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:16px}
.meta div{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 11px;font-size:12.5px}.meta b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;opacity:.7;font-weight:600}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font:600 13px inherit;color:var(--ink);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.chip:hover{border-color:var(--or)}.chip.or{background:var(--or);color:#fff;border-color:var(--or)}.chip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
h2.c1{font-size:24px;margin:38px 0 6px;padding-bottom:8px;border-bottom:3px solid var(--or);color:var(--navy);letter-spacing:-.3px}
:root[data-t=dark] h2.c1{color:#fff}
h3.c2{font-size:18px;margin:26px 0 6px;color:var(--navy)}:root[data-t=dark] h3.c2{color:#dce8fb}
h4.c3{font-size:15px;margin:18px 0 4px;color:var(--or)}
.hh{position:relative}.hh .lk{opacity:0;position:absolute;left:-22px;top:2px;border:0;background:none;color:var(--mut);cursor:pointer;font-size:15px}.hh:hover .lk{opacity:1}
p.tx{margin:8px 0}ul.bl{margin:8px 0;padding-left:22px}ul.bl li{margin:3px 0}
.blk{scroll-margin-top:80px;border-radius:var(--rad)}.flash{animation:fl 2.2s ease}@keyframes fl{0%,40%{box-shadow:0 0 0 4px var(--or)}100%{box-shadow:0 0 0 4px transparent}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);margin:14px 0;overflow:hidden;box-shadow:var(--sh)}
.card>.ch{background:var(--navy);color:#fff;padding:10px 14px;font-weight:700;font-size:14.5px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.card .row{display:grid;grid-template-columns:96px 1fr;border-top:1px solid var(--line)}
.card .lab{padding:11px 12px;font:800 11.5px/1.3 inherit;letter-spacing:.6px;text-transform:uppercase}
.row.NGA .lab{background:var(--nga);color:var(--ngaink)}.row.POP .lab{background:var(--pop);color:var(--popink)}.row.Obs .lab{background:var(--obs);color:var(--mut)}.row.Att .lab{background:var(--att);color:var(--attink)}
.row.NGA .bd{background:color-mix(in srgb,var(--nga) 45%,var(--card))}.row.POP .bd{background:color-mix(in srgb,var(--pop) 55%,var(--card))}.row.Att .bd{background:color-mix(in srgb,var(--att) 55%,var(--card))}
.bd{padding:10px 14px}.bd p{margin:4px 0}.bd ol,.bd ul{margin:0;padding-left:20px}.bd li{margin:5px 0}
.bd label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}.bd input[type=checkbox]{margin-top:4px;accent-color:var(--or);width:17px;height:17px;flex:none}
.bd.chk li.done{opacity:.5;text-decoration:line-through}
.tools{display:flex;gap:6px}.tb{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:4px 9px;font:600 11.5px inherit;cursor:pointer}
.tb:hover{background:rgba(255,255,255,.25)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;margin:12px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;font-size:14px;box-shadow:var(--sh)}
.tbl th{background:var(--navy);color:#fff;text-align:left;padding:9px 12px;font-size:12.5px;letter-spacing:.3px}
.tbl td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}.tbl tr:nth-child(even) td{background:color-mix(in srgb,var(--obs) 55%,var(--card))}
.tbl td ul{margin:0;padding-left:18px}.tbl td.k{font-weight:700;white-space:nowrap}
.scroll{overflow-x:auto}
.crise{background:var(--card);border:1px solid var(--line);border-left:6px solid #c62828;border-radius:var(--rad);margin:16px 0;box-shadow:var(--sh);overflow:hidden}
.crise>.ch{padding:11px 14px;font-weight:800;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:linear-gradient(90deg,color-mix(in srgb,#c62828 14%,var(--card)),var(--card))}
.crise .role{display:grid;grid-template-columns:150px 1fr 130px;border-top:1px solid var(--line)}
.crise .rn{padding:10px 12px;font-weight:800;font-size:13px;background:var(--obs)}
.crise .ra{padding:9px 14px}.crise .ra ul{margin:0;padding-left:18px}.crise .ra li{margin:4px 0}
.crise .rq{padding:10px 12px;font-size:12px;color:var(--popink);background:var(--pop);font-weight:700}
.rq small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.6px;opacity:.7;margin-bottom:2px}
.puc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.puc div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--sh)}.puc b{display:block;color:var(--or);font-size:13px}.puc span{font-size:13.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.two>div{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:12px 16px;box-shadow:var(--sh)}.two h5{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--or)}.two ol{margin:0;padding-left:20px}.two li{margin:5px 0}
.a{color:var(--or);font-weight:600;text-decoration:none;border-bottom:1px dotted var(--or)}
.foot{margin-top:50px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
#cen{position:fixed;inset:0;background:rgba(5,10,20,.65);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:70px 14px 14px;overflow:auto}
#cen.on{display:flex}#cen .box{background:var(--card);border-radius:18px;max-width:900px;width:100%;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#cen h3{margin:0 0 10px;font-size:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px;margin-top:12px}
.gt{border:1px solid var(--line);border-left:5px solid #c62828;background:var(--card);border-radius:11px;padding:11px 12px;cursor:pointer;font:700 13.5px inherit;color:var(--ink);text-align:left}.gt:hover{background:var(--nga)}
#cf{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 15px inherit}
#menu{display:none}
@media(max-width:900px){.wrap{display:block}nav#toc{position:fixed;left:0;top:56px;bottom:0;width:84%;max-width:340px;background:var(--card);z-index:70;transform:translateX(-102%);transition:.2s;box-shadow:8px 0 30px rgba(0,0,0,.3);height:auto}nav#toc.on{transform:none}#menu{display:inline-flex}header .ttl small{display:none}
 .card .row{grid-template-columns:1fr}.card .lab{padding:7px 12px}.crise .role{grid-template-columns:1fr}.crise .rq{display:flex;gap:6px;align-items:baseline}.rq small{display:inline;margin:0}.two{grid-template-columns:1fr}
 main{padding:14px 12px 80px}.hh .lk{display:none}header .btn span.lb{display:none}}
@media print{header,nav#toc,.quick,.tools,.lk,#cen,.foot .no{display:none!important}.wrap{display:block}body{background:#fff;color:#000}.card,.crise,.tbl{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<header>
 <button class="btn" id="menu" aria-label="Sumário"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
 <div class="ttl">MNP · P505<small>KLOG Guarulhos · v02</small></div>
 <div class="sw"><input id="q" type="search" placeholder="Buscar: chave, incêndio, visitante, arma…" autocomplete="off" aria-label="Buscar no manual"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><div id="res" role="listbox"></div></div>
 <button class="btn or" id="bcen"><svg viewBox="0 0 24 24"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v5M12 18v.5"/></svg><span class="lb">Emergência</span></button>
 <button class="btn" id="bth" aria-label="Alternar tema"><svg viewBox="0 0 24 24"><path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/></svg></button>
</header>
<div class="wrap">
<nav id="toc" aria-label="Sumário"></nav>
<main id="main"></main>
</div>
<div id="cen"><div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Roteiros de crise — escolha o cenário</h3><button class="chip" id="cx">Fechar</button></div><input id="cf" placeholder="Filtrar cenário (ex.: incêndio, roubo, energia)" autocomplete="off"><div class="grid" id="cg"></div></div></div>
<script>
const DATA=[{"t": "h", "num": "1", "title": "Introdução", "lvl": 1}, {"t": "h", "num": "1.1", "title": "Geral", "lvl": 2}, {"t": "p", "text": "Todo Sistema Integrado de Segurança (S.I.S.) é composto por três componentes interdependentes: Humano, Técnico e Procedimental. Cabe aos procedimentos orientar e controlar os demais componentes, especificando o que fazer, quem deve fazer, quando e como."}, {"t": "h", "num": "1.2", "title": "Objetivo", "lvl": 2}, {"t": "p", "text": "Este Manual tem por finalidade:"}, {"t": "ul", "items": ["Propor normas de segurança baseadas em ações fundamentalmente preventivas, mas em condições de reagir eficazmente diante de qualquer adversidade.", "Proporcionar excelente nível de segurança patrimonial, capaz de proteger vidas e instalações contra riscos, minimizando os efeitos de possíveis ocorrências.", "Evitar que a equipe seja induzida a erros mediante persuasão ou julgamento equivocado, por meio da padronização dos procedimentos de atendimento."]}, {"t": "h", "num": "1.3", "title": "Abrangência", "lvl": 2}, {"t": "p", "text": "Todos os colaboradores, prestadores de serviços, inquilinos e visitantes estão obrigados a cumprir as NGA e POPs estabelecidos neste Manual. Sua abrangência é global e alcança todos os níveis do KLOG Guarulhos — P505."}, {"t": "h", "num": "1.4", "title": "Conceitos e Definições", "lvl": 2}, {"t": "h", "num": "1.4.1", "title": "Serviços de Segurança", "lvl": 3}, {"t": "p", "text": "O serviço de vigilância fica subordinado ao gerente do KLOG Guarulhos, por intermédio da Moked do Brasil, devendo manter vigilância permanente, diurna e noturna, nas partes comuns do empreendimento."}, {"t": "h", "num": "1.4.2", "title": "Autorização para Alterações", "lvl": 3}, {"t": "p", "text": "A alteração deste documento pode ser solicitada pelo cliente, mas é executada exclusivamente pela Moked do Brasil, após avaliação de efeitos legais e análise de riscos. O documento alterado deverá ser aprovado pela Moked do Brasil e pelo cliente antes de ser implantado em campo."}, {"t": "h", "num": "1.4.3", "title": "Terminologia e Abreviações", "lvl": 3}, {"t": "table", "title": null, "hdr": ["Sigla / Termo", "Definição"], "rows": [["S.I.S.", ["Sistema Integrado de Segurança"]], ["NGA", ["Normas Gerais de Ação"]], ["POP", ["Procedimento Operacional Padrão"]], ["CCO", ["Centro de Controle Operacional — local isolado e protegido que centraliza o monitoramento via CFTV, Alarme, Controle de Acesso e Iluminação"]], ["CFTV", ["Circuito Fechado de Televisão"]], ["VSPP", ["Vigilante de Segurança Patrimonial Privada"]], ["VSPP Líder", ["Vigilante responsável pela coordenação operacional do turno"]], ["VSPP Apoio/Ronda", ["Vigilante responsável pelas eclusas, acessos e rondas perimetrais"]], ["CDA / Recepção", ["Controlador de Acesso e Recepcionista"]], ["PCI", ["Prevenção e Combate a Incêndio"]], ["SDAI", ["Sistema de Detecção e Alarme de Incêndio"]], ["HT", ["Handy-Talkie (rádio comunicador portátil)"]], ["RS", ["Registro Situacional / Relatório de Ocorrência"]], ["TTI", ["Tiro Tático Israelense"]], ["Accelero", ["Sistema de controle de acesso por reconhecimento facial 100%"]], ["Eclusa", ["Área de transição controlada entre espaço externo e interno (veículos)"]], ["Reverse Control", ["Conceito de controle inteligente sem inspeção rotineira de porta-malas ou baús"]], ["Ameaça", ["Identificação da matriz do risco"]], ["Contramedidas", ["Recursos humanos, técnicos e administrativos para controle de riscos"]], ["Comitê de Segurança", ["Grupo composto por representantes do KLOG para gerenciamento de riscos e crises"]], ["Colaboradores", ["Todos os elementos humanos, empregados e terceirizados, que atuam no empreendimento"]]], "kind": "glossario"}, {"t": "h", "num": "1.5", "title": "Atribuições e Responsabilidades", "lvl": 2}, {"t": "h", "num": "1.5.1", "title": "Administração", "lvl": 3}, {"t": "p", "text": "Gerência do empreendimento KLOG Guarulhos. Responsável pela gestão do condomínio logístico, aprovação de alterações neste Manual e interface com os inquilinos nas demandas de segurança."}, {"t": "h", "num": "1.5.2", "title": "Moked do Brasil", "lvl": 3}, {"t": "p", "text": "Consultoria especializada responsável pela gestão do contrato de segurança. Garante a homologação, supervisão e conformidade da empresa de segurança contratada, bem como a qualidade e eficácia dos procedimentos. Disponível 24h por dia, 7 dias por semana, incluindo feriados."}, {"t": "h", "num": "1.5.3", "title": "Haganá Segurança Patrimonial", "lvl": 3}, {"t": "p", "text": "Empresa de segurança contratada, responsável pela segurança física do empreendimento e de seus usuários, com escopo de vigilância patrimonial, CDA/Recepção e operação do CCO. A contratação, gestão e eventual substituição dos profissionais de segurança são de responsabilidade exclusiva da Haganá. Nota: Os serviços de vigilância são fornecidos por empresa credenciada pela Polícia Federal."}, {"t": "h", "num": "1.5.4", "title": "Efetivo", "lvl": 3}, {"t": "p", "text": "Conjunto de profissionais alocados pela Haganá. Funções e atribuições detalhadas no Capítulo 3."}, {"t": "h", "num": "2", "title": "Normas Gerais de Ação", "lvl": 1}, {"t": "h", "num": "2.1", "title": "Do KLOG Guarulhos", "lvl": 2}, {"t": "h", "num": "2.1.1", "title": "Geral", "lvl": 3}, {"t": "p", "text": "Cada usuário deve permitir acesso somente para pessoas conhecidas, informando à segurança sobre a presença de pessoas estranhas. Na eventualidade de irregularidades ou ações criminosas, é obrigatório comunicar imediatamente a equipe de segurança. Recomenda-se a política de \"mesa limpa\" ao término do expediente."}, {"t": "h", "num": "2.1.2", "title": "Acesso de Pedestres", "lvl": 3}, {"t": "p", "text": "O acesso ao KLOG Guarulhos será realizado exclusivamente por pessoas autorizadas e devidamente identificadas. O cadastro é feito via sistema Accelero (reconhecimento facial). No cadastro fotográfico é obrigatório retirar bonés, óculos escuros e qualquer item que dificulte a identificação. Nome completo e CPF são obrigatórios."}, {"t": "h", "num": "2.1.3", "title": "Acesso de Veículos", "lvl": 3}, {"t": "p", "text": "É permitida a entrada apenas do motorista conduzindo o veículo. Os demais ocupantes devem acessar pelo torniquete de pedestres. A placa do veículo é obrigatória no cadastro. O VSPP Apoio deverá verificar visualmente se há outros ocupantes que necessitem identificação."}, {"t": "card", "title": "2.1.3.1 — Dos Usuários (Inquilinos)", "rows": [{"label": "NGA", "items": ["Quando o VSPP Apoio perceber que um usuário irá entrar ou sair com veículo, deverá observar visualmente se há movimentação suspeita ou veículo com pessoas parado próximo ao acesso."]}, {"label": "POP", "items": ["Verificar se não há outros ocupantes que necessitem identificação.", "Apenas o motorista acessa pela eclusa de veículos.", "Demais ocupantes: acessar pelo torniquete de pedestres.", "Exceções mediante autorização da administração."]}]}, {"t": "card", "title": "2.1.3.2 — Dos Visitantes", "rows": [{"label": "NGA", "items": ["O visitante deverá dirigir-se à portaria, apresentar documento com foto, nome completo, empresa (quando aplicável) e nome do inquilino/unidade a visitar."]}, {"label": "POP", "items": ["1. Acessar o Accelero com login individual.", "2. Selecionar \"Cadastro Rápido\" no Dashboard.", "3. No campo \"Tipo\", selecionar Visita.", "4. Definir data e horário limite no campo \"Fim\".", "5. Clicar em \"+ Incluir\" e selecionar unidade e pessoa visitada.", "6. Preencher dados completos do visitante.", "7. Capturar foto facial pela webcam.", "8. Clicar em \"Salvar\" e monitorar acesso via Log de Acesso.", "Não haverá liberação manual sem validação documental e conferência sistêmica."]}]}, {"t": "card", "title": "2.1.3.3 — Trânsito de Equipamentos (Saída a Pé)", "rows": [{"label": "NGA", "items": ["Volumes que passam normalmente pelo torniquete não são objeto de fiscalização. Volumes que exijam uso do portão lateral requerem autorização formal do inquilino ou da administração."]}, {"label": "POP", "items": ["Identificar e registrar nome completo e documento de quem realiza a saída.", "Registrar nome do responsável que autorizou a liberação.", "Registrar data e horário da saída.", "Arquivar registro para eventual conferência.", "Qualquer liberação fora desses critérios: comunicar imediatamente à Supervisão e à administração."]}, {"label": "Observações", "items": ["Não é atribuição da segurança validar o conteúdo do item transportado. Sua responsabilidade é restrita ao controle do acesso pelo portão lateral mediante autorização formal."]}]}, {"t": "h", "num": "2.1.4", "title": "Prevenção de Incêndio", "lvl": 3}, {"t": "p", "text": "É proibida a entrada e guarda de explosivos, corrosivos e inflamáveis em qualquer dependência do KLOG Guarulhos. É proibido o uso de substâncias que produzam mau cheiro, exalações ou ruídos que ofendam a integridade física dos usuários. Manter os recursos de PCI (extintores etc.) em condições de uso."}, {"t": "h", "num": "2.1.5", "title": "Desocupação de Emergência", "lvl": 3}, {"t": "p", "text": "Em caso de perigo iminente: desligar equipamentos elétricos, fechar janelas e portas sem trancá-las, deixar o local com calma seguindo as instruções da segurança, não retornar para pegar pertences pessoais."}, {"t": "h", "num": "2.1.6", "title": "Acesso à Área Privativa", "lvl": 3}, {"t": "p", "text": "A liberação do acesso à área privativa é responsabilidade do inquilino. À segurança cabe garantir o controle de acesso, identificação e registro. Pessoas indispensáveis à inspeção ou trabalhos de administração poderão ser autorizadas desde que acompanhadas."}, {"t": "h", "num": "2.1.7", "title": "Obras e Realocações", "lvl": 3}, {"t": "p", "text": "Não serão permitidas alterações ou obras que ponham em risco a integridade dos usuários. Obras e reformas deverão observar as normas vigentes e ser previamente autorizadas pela administração."}, {"t": "h", "num": "2.1.8", "title": "Reclamações de Clientes", "lvl": 3}, {"t": "p", "text": "Toda reclamação deverá ser direcionada à Administração ou ao VSPP Líder para registro e análise preliminar. A demanda deverá ser encaminhada à Moked para avaliação técnica. A apuração será conduzida de forma imparcial com análise dos registros e imagens."}, {"t": "h", "num": "2.1.9", "title": "Controle de Claviculário", "lvl": 3}, {"t": "card", "title": "Controle de Claviculário", "rows": [{"label": "NGA", "items": ["Controle de chaves em documento específico. As chaves ficam sob guarda da portaria, em claviculário apropriado. Somente entregar mediante autorização do Gerente do Empreendimento e solicitante com cadastro prévio."]}, {"label": "POP", "items": ["Conferir autorização e cadastro do solicitante antes da entrega.", "Registrar na planilha: data, hora, nome do solicitante, responsável pela autorização.", "Na devolução: registrar data, hora, nome de quem devolveu e do profissional que recebeu.", "A segurança é responsável pelo controle, registro e conferência diária das chaves."]}]}, {"t": "h", "num": "2.1.10", "title": "Retirada de Lixo", "lvl": 3}, {"t": "card", "title": "Retirada de Lixo", "rows": [{"label": "NGA", "items": ["Os resíduos deverão ser acondicionados em caçamba específica. A coleta é realizada por empresa contratada e habilitada."]}, {"label": "POP", "items": ["A equipe de limpeza é responsável pela coleta interna e acondicionamento na caçamba.", "O VSPP deverá acompanhar a retirada pela empresa contratada.", "Coleta programada: segunda a sexta-feira, período comercial."]}, {"label": "Observações", "items": ["Se a caçamba atingir capacidade máxima antes da data programada, comunicar a Administração para solicitar coleta extraordinária."]}]}, {"t": "h", "num": "2.2", "title": "Do Efetivo", "lvl": 2}, {"t": "p", "text": "Todos os colaboradores da equipe de segurança devem:"}, {"t": "ul", "items": ["Conhecer todos os locais nas áreas comuns onde possam prestar serviços.", "Manter atitude, postura e comportamento condizentes com o decoro de suas atividades.", "Receber e passar o serviço na presença do substituto ou substituído.", "Manter o CCO informado sobre ocorrências.", "Solicitar rendição antes de se ausentar do posto.", "Estar atento a toda movimentação suspeita.", "Manter o zelo pessoal: uniforme limpo e passado, barba feita, cabelo e unhas aparados, uso de desodorante.", "Proteger e preservar vidas e o patrimônio.", "Diante do imprevisto, agir por iniciativa, seguindo as diretrizes do KLOG Guarulhos.", "Agir com firmeza, educação, tranquilidade e responsabilidade.", "Assumir o plantão checando todos os controles, instrumentos e materiais de carga do posto.", "Ser cordial com todos, sem criar vínculos de amizade com funcionários de terceiros.", "Chegar pelo menos alguns minutos antes do início da jornada para checar o posto.", "Permitir acesso somente a pessoas previamente autorizadas, conforme orientação da Moked e da Haganá.", "Proibir o uso do telefone do posto para ligações particulares."]}, {"t": "ul", "items": ["Registrar no Livro de Ocorrências e informar à Moked e à Supervisão qualquer irregularidade.", "Cumprir e fazer cumprir as normas deste Manual.", "Abster-se de comentários ou fofocas que comprometam o ambiente de trabalho."]}, {"t": "h", "num": "3", "title": "Componentes do S.I.S.", "lvl": 1}, {"t": "h", "num": "3.1", "title": "Recursos Humanos", "lvl": 2}, {"t": "h", "num": "3.1.1", "title": "Modo de Estruturação", "lvl": 3}, {"t": "p", "text": "A gestão dos profissionais de segurança é de responsabilidade exclusiva da Haganá, por meio de estrutura hierárquica e piramidal, com supervisão da Moked do Brasil."}, {"t": "h", "num": "3.1.2", "title": "Composição Operacional", "lvl": 3}, {"t": "table", "title": null, "hdr": ["Posto", "Função / Cargo", "Local", "Escala", "Diurno 06-18h", "Noturno 18-06h"], "rows": [["P1 - Lima", ["VSPP Líder"], ["Coordenação"], ["4x2 – 24h -3"], ["01"], ["01"]], ["P2 - Apoio", ["VSPP Apoio/Ronda"], ["Triagem / Eclusas"], ["4x2 – 24h -3"], ["01"], ["01"]], ["CCO", ["Vigilante de CCO"], ["Monitoramento"], ["4x2 – 24h -3"], ["01"], ["01"]], ["CDA", ["Controlador de Acesso"], ["Portaria / Apoio"], ["12x36 – 24h"], ["01"], ["—"]], ["P3 - Ronda", [""], [""], ["5x2 – 12h -1"], [""], [""]], ["RCP", [""], [""], ["5x2 – 8h -1"], [""], [""]], ["TOTAL", [""], [""], [""], ["04"], ["03"]]], "kind": null}, {"t": "h", "num": "3.1.3", "title": "Atribuições por Função", "lvl": 3}, {"t": "p", "text": "VSPP Líder Responsável pela coordenação operacional do turno. Ao assumir o posto, realiza passagem de serviço com o antecessor, verificando ocorrências registradas, orientações pendentes, condições operacionais, materiais de carga e equipamentos. É o elo entre equipe de segurança, inquilinos, administração, Moked e Supervisão. Compete ao Líder conhecer todas as funções dos postos (acesso, ronda, CCO e apoio), garantindo padronização, orientação técnica contínua e cobrança do cumprimento das normas. Atua como disseminador de conhecimento, corrigindo desvios operacionais e assegurando postura profissional da equipe. Deve realizar rondas periódicas em todos os postos e áreas do condomínio, supervisionar sistemas de segurança e reportar imediatamente qualquer anomalia ao CCO e à Supervisão. Ao término do expediente, realiza passagem de serviço detalhada à equipe subsequente."}, {"t": "p", "text": "VSPP Apoio/Ronda O VSPP Apoio permanece posicionado nas eclusas e áreas externas, realizando visualização contínua da área, controlando a movimentação de pessoas e veículos e atuando diretamente na triagem dos acessos. Deve impedir estacionamento irregular nas áreas de acesso e comunicar imediatamente via rádio HT qualquer situação suspeita."}, {"t": "p", "text": "O VSPP Ronda é responsável pela execução de rondas sistemáticas em todo o perímetro e áreas internas, realizando fiscalização preventiva de estruturas, áreas comuns, docas, estacionamentos e pontos sensíveis. Mantém contato permanente com o CCO e reporta imediatamente ao Líder qualquer anomalia."}, {"t": "p", "text": "Vigilante de CCO Responsável pelo monitoramento contínuo por meio de rondas virtuais sistemáticas. Verifica regularmente o funcionamento do CFTV, o posicionamento das câmeras e o status do sistema de alarme perimetral. Realiza checagem de eventos no sistema Accelero, aciona botoeiras dos acessos quando necessário e é o ponto de contato com autoridades externas. Toda anormalidade deve ser registrada e reportada à liderança. Proibido o acesso de terceiros ao CCO sem autorização prévia da administração. Bloquear saídas em caso de ocorrências, acionar botão de pânico imediatamente."}, {"t": "p", "text": "CDA / Recepção Responsável pelo atendimento ao público geral, interno e externo: cadastro de visitantes, prestadores e motoristas, orientações gerais, recebimento de materiais, liberações autorizadas e controle de fluxo de pessoas. Mantém comunicação permanente com a liderança de segurança, CCO, VSPP Apoio/Ronda, administração e inquilinos."}, {"t": "h", "num": "3.2", "title": "Recursos Técnicos", "lvl": 2}, {"t": "h", "num": "3.2.1", "title": "Controle de Acesso", "lvl": 3}, {"t": "table", "title": null, "hdr": ["Item", "Qtd.", "Local / Abrangência"], "rows": [["Dilaceradores de pneus", ["04"], ["Acessos veiculares"]], ["Eclusas veiculares", ["04"], ["Entradas e saídas principais"]], ["Cancelas automatizadas", ["06"], ["Controle de fluxo veicular"]], ["Portões automatizados", ["16 fls"], ["Perímetro e acessos internos"]], ["Portaria Blindada", ["01"], ["Acesso principal"]], ["Sistema Accelero (estações)", ["03"], ["Pedestres, veículos e checagem"]], ["Leitores Faciais", ["26"], ["Acessos pedestres e veículos"]], ["Torniquetes automatizados", ["04"], ["Controle operacional pela portaria e CCO"]], ["Sala de Seg blindada (CCO) Diretrizes operacionais:", ["01"], ["Controle operacional (Pânico)"]]]}, {"t": "ul", "items": ["Nos acessos de veículos e caminhões não haverá abertura rotineira de porta-malas ou baús (Reverse Control).", "O VSPP Apoio poderá realizar verificação visual da cabine mediante fundada suspeita ou inconsistência cadastral.", "A saída de veículos deverá ser autorizada pelo inquilino responsável, via ramal ou sistema Accelero.", "Portões permanecem fechados no período noturno sem operação do inquilino."]}, {"t": "h", "num": "3.2.2", "title": "Classificação de Ambientes", "lvl": 3}, {"t": "p", "text": "Cada ambiente possui nível específico de controle de acesso, definido conforme grau de criticidade operacional."}, {"t": "table", "title": null, "hdr": ["Nível", "Identificação", "Circulação / Critério"], "rows": [["Livre", ["Áreas externas"], ["Sem restrições"]], ["Controlado", ["Áreas comuns do KLOG Guarulhos"], ["Monitoramento com abordagem preventiva de suspeitos e orientações pontuais"]], ["Fiscalizado", ["Áreas internas do KLOG Guarulhos"], ["Autorização do Diretor/Gerente"]], ["Restrito", ["Guarita Blindada / Sala de Monitoramento (CCO)"], ["Somente com autorização da Moked após pesquisa prévia"]]]}, {"t": "card", "title": "Nível Controlado — Circulação de Pedestres", "rows": [{"label": "NGA", "items": ["As áreas de Nível Controlado devem permanecer sob monitoramento constante com foco na identificação imediata de comportamentos suspeitos ou não conformidades. Pessoas sem vínculo operacional ou autorização formal não poderão circular internamente sem validação prévia."]}, {"label": "POP", "items": ["O VSPP Apoio/Ronda deve garantir o cumprimento deste nível, realizando abordagem preventiva sempre que identificar atitude suspeita ou permanência indevida nas áreas comuns."]}, {"label": "Observações", "items": ["O acesso à sala técnica (racks, servidores, sistemas de segurança) é controlado por claviculário e liberado exclusivamente mediante autorização formal da Administração ou para técnicos previamente cadastrados."]}]}, {"t": "card", "title": "Nível Controlado — Circulação de Veículos", "rows": [{"label": "NGA", "items": ["Foco na identificação de condutas suspeitas, inconsistências no cadastro ou qualquer indício de risco. A equipe deve manter atenção redobrada quanto à ocupação do veículo, observando visualmente cabine e bancos dentro do conceito de Reverse Control."]}, {"label": "Atenção especial", "items": ["A abertura de porta-malas, cabines ou baús somente deverá ocorrer quando houver fundada suspeita, solicitação formal da Administração ou necessidade operacional devidamente justificada."]}]}, {"t": "card", "title": "Nível Fiscalizado — Circulação de Veículos", "rows": [{"label": "NGA", "items": ["O VSPP Apoio/Ronda deverá manter vigilância contínua sobre entradas e saídas, atuando preventivamente para coibir acessos indevidos."]}, {"label": "POP", "items": ["Na saída: observar o ambiente externo, verificar movimentação suspeita antes de abrir o acesso.", "Na entrada: solicitar que o condutor abaixe os vidros para identificação visual dos ocupantes.", "Passageiros não cadastrados devem descer do veículo e realizar cadastro na portaria.", "Visitantes: somente com autorização prévia do responsável pelo empreendimento.", "Funcionários/Prestadores: ingresso depende de autorização expressa do Gerente ou Diretor.", "Escolta armada: não é permitida a entrada de veículos de escolta. A escolta aguarda do lado externo."]}]}, {"t": "card", "title": "Nível Fiscalizado — Carro-Forte", "rows": [{"label": "NGA", "items": ["O acesso segue o padrão de entregas programadas. Durante toda a permanência, a equipe da transportadora ficará sob monitoramento contínuo por CFTV. A autorização é de responsabilidade da Segurança."]}, {"label": "POP", "items": ["Acesso previamente autorizado pelo VSPP Líder com validação junto ao locatário responsável.", "Todos os integrantes devem apresentar documento oficial. Um vigilante pode trazer os documentos dos demais.", "Conferência física dos ocupantes realizada diretamente na viatura. Após validação, o veículo é liberado e escoltado ao ponto definido.", "Saída: todos embarcados. Dois carros-fortes simultâneos: o segundo aguarda a saída do primeiro."]}, {"label": "Observações", "items": ["Em caso de anormalidade ou risco, acionar imediatamente a Polícia Militar, gestão Moked e Haganá."]}]}, {"t": "card", "title": "Nível Restrito — Guarita / CCO", "rows": [{"label": "NGA", "items": ["Somente podem acessar a Portaria e o CCO pessoas previamente autorizadas."]}, {"label": "POP", "items": ["Confirmar que a pessoa consta na lista de autorizados antes de liberar o acesso.", "Se não constar: entrar em contato com a Moked, que poderá ou não autorizar.", "Primeiro acesso: solicitante deve enviar dados à Moked com 24h de antecedência.", "Somente a Moked pode autorizar acesso ao CCO."]}, {"label": "Atenção especial", "items": ["Sempre fazer o acesso de uma pessoa por vez. Quando houver acessos externos ao CCO, a Guarita Blindada deve permanecer segura, evitando entradas de pessoas fora do S.I.S."]}]}, {"t": "h", "num": "3.2.3", "title": "CFTV", "lvl": 3}, {"t": "p", "text": "O sistema de CFTV é composto por 96 câmeras IP, distribuídas estrategicamente nas áreas internas, externas e perimetrais. O monitoramento é realizado localmente pelo CCO e conta com suporte remoto da Central Moked. Informações de layout físico e arquitetura do sistema são de uso restrito."}, {"t": "table", "title": null, "hdr": ["Tipo de Equipamento", "Qtd.", "Finalidade"], "rows": [["Câmeras IP fixas", ["Conf. projeto"], ["Áreas internas e externas"]], ["Speed Domes (PTZ)", ["Conf. projeto"], ["Monitoramento perimetral e áreas amplas"]], ["NVR (gravação)", ["Conf. projeto"], ["Armazenamento local no CCO"]], ["Estação de monitoramento", ["Conf. projeto"], ["Operação em tempo real"]]], "kind": null}, {"t": "card", "title": "Armazenamento de Imagens do CFTV", "rows": [{"label": "NGA", "items": ["Todas as imagens são propriedade exclusiva do Condomínio KLOG Guarulhos.", "O acesso, extração, cópia ou compartilhamento de imagens somente ocorre mediante requisição judicial ou autorização expressa e fundamentada da Administração. O tratamento das imagens deve observar a LGPD."]}, {"label": "POP", "items": ["Em caso de ocorrência: identificar o período exato, preservar e salvar as imagens com integridade.", "Registrar em relatório: data, horário, câmeras envolvidas e motivo da preservação.", "Informar à Administração e à Moked sobre o armazenamento realizado.", "A liberação de imagens depende de autorização formal da Administração ou requisição legal."]}, {"label": "Observações", "items": ["É vedado à equipe de segurança fornecer imagens diretamente a terceiros.", "Toda solicitação deve ser formalmente direcionada à Administração."]}]}, {"t": "h", "num": "3.2.4", "title": "Sistema de Alarme", "lvl": 3}, {"t": "card", "title": "Disparos de Alarme — Perimetral e SDAI", "rows": [{"label": "NGA", "items": ["Nenhum disparo poderá ser ignorado ou presumido como falha sem validação via CFTV, verificação física e checagem do sistema. Toda ocorrência gera registro em RS, mesmo que constatado falso disparo. Nível de resposta conforme criticidade: perimetral (foco em intrusão) e SDAI (prioridade máxima)."]}, {"label": "POP", "items": ["Alarme perimetral: CCO identifica a zona acionada, direciona câmeras e comunica via HT. VSPP Apoio/Ronda desloca-se para averiguação física. Sem ameaça: resetar sistema com registro. Disparos recorrentes: comunicar Administração e elaborar relatório técnico.", "Alarme SDAI: CCO identifica o ponto, comunica imediatamente o Líder e monitora imagens. VSPP designado desloca-se ao local. Confirmado indício de incêndio: iniciar Plano de Emergência. Falso disparo: resetar com registro detalhado."]}, {"label": "Observações", "items": ["Disparos repetitivos devem ser tratados como potencial falha técnica até análise conclusiva. O tempo de resposta ao SDAI é imediato e prioritário."]}]}, {"t": "h", "num": "3.2.5", "title": "Iluminação", "lvl": 3}, {"t": "card", "title": "Luzes", "rows": [{"label": "NGA", "items": ["O sistema de iluminação é automatizado e controlado por sistema programado (LEND), incluindo acionamento por fotocélula e temporização conforme configuração técnica definida pela Administração."]}, {"label": "POP", "items": ["Falha: registrar no livro de ocorrências com horário da interrupção e da normalização.", "Anomalias (pontos inoperantes, oscilação, falha no acionamento automático):", "comunicar imediatamente a Administração."]}, {"label": "Atenção especial", "items": ["Falhas em áreas sensíveis (acessos, perímetro, portarias, circulação noturna)", "devem ser comunicadas com prioridade, pelo impacto direto na segurança operacional."]}]}, {"t": "h", "num": "3.2.6", "title": "Comunicação", "lvl": 3}, {"t": "table", "title": null, "hdr": ["Equipamento", "Uso"], "rows": [["Rádio HT", ["Comunicação interna entre VSPP, CCO e liderança"]], ["Smartphone", ["Comunicação com Moked, Haganá e registro em grupo WhatsApp"]], ["Ramal interno (quando aplicável)", ["Comunicação entre portaria, CCO e administração"]], ["Telefone externo", ["Acionamento de autoridades, bombeiros e emergências"]]], "kind": null}, {"t": "h", "num": "3.2.7", "title": "Sistema de PCI e Escape", "lvl": 3}, {"t": "table", "title": null, "hdr": ["Componente", "Localização / Observação"], "rows": [["SDAI — Central de Alarme de Incêndio", ["CCO e CDA/Recepção"]], ["Extintores", ["Distribuídos nas áreas comuns e privativas conforme AVCB"]], ["Hidrantes", ["Conforme projeto aprovado"]], ["Carretas com pó químico", ["Posicionamento conforme plano de PCI"]], ["Sprinklers", ["G100 e G200 em todos os módulos"]], ["Rotas de fuga / Saídas de emergência", ["Sinalizadas conforme AVCB e planta de emergência"]]]}, {"t": "h", "num": "4", "title": "Procedimentos Operacionais Padrão (POP)", "lvl": 1}, {"t": "h", "num": "4.1", "title": "Rotinas Operacionais", "lvl": 2}, {"t": "card", "title": "Passagem de Serviço / Troca de Turno", "rows": [{"label": "NGA", "items": ["A passagem de serviço é obrigatória e deve ocorrer na presença física do profissional que assume e do que está encerrando o turno. Ambos devem estar devidamente uniformizados."]}, {"label": "POP", "items": ["Conferir material de carga (armas, rádios, documentos), claviculário e equipamentos do posto.", "O profissional que encerra relata verbalmente e por escrito (Livro de Ocorrências) qualquer fato relevante.", "O profissional que assume confirma o recebimento e eventuais orientações pendentes.", "Qualquer divergência deve ser comunicada imediatamente ao Líder e à Supervisão."]}]}, {"t": "card", "title": "Rendições e Descanso", "rows": [{"label": "NGA", "items": ["As rendições deverão ocorrer mediante solicitação do posto para atendimento de necessidades fisiológicas, refeições ou pausas regulamentares. O VSPP não poderá abandonar o posto antes da chegada de sua rendição."]}, {"label": "POP", "items": ["Solicitar rendição via rádio HT. A substituição é realizada diretamente no posto, sem descontinuidade.", "Refeição diurna: preferencialmente entre 11h00 e 14h00.", "Refeição noturna: preferencialmente entre 00h00 e 01h30.", "Pausas para necessidades fisiológicas: solicitadas via rádio ao responsável pelo turno.", "Em postos com permanência prolongada em pé: alternância postural com pausa de ~10 min/hora.", "Mal-estar: comunicar imediatamente à Supervisão para providenciar substituição."]}]}, {"t": "card", "title": "Faltas e Ausências", "rows": [{"label": "NGA", "items": ["Toda ausência deverá ser comunicada à Base Operacional, Supervisão e à liderança de plantão para programação de cobertura e manutenção do efetivo completo."]}, {"label": "POP", "items": ["Faltas programadas: informar com antecedência mínima de 24 horas.", "Faltas emergenciais: comunicar imediatamente, assim que houver ciência da impossibilidade.", "O profissional de plantão permanece no posto até a chegada da rendição, salvo orientação da Supervisão.", "Após atendimento médico: informar à Base Operacional e Supervisão sobre atestado e data de retorno. Atestado entregue ao Supervisor em até 48 horas."]}, {"label": "Observações", "items": ["A falta de comunicação prévia pode impactar na programação e na manutenção do efetivo completo."]}]}, {"t": "card", "title": "Rondas Operacionais", "rows": [{"label": "NGA", "items": ["As rondas deverão ser realizadas de forma sistemática e inopinada, conforme cronograma operacional, garantindo presença ativa, efeito dissuasivo e fiscalização contínua das áreas internas e externas."]}, {"label": "POP", "items": ["Inspecionar: áreas comuns, perímetro, acessos, equipamentos de segurança e pontos sensíveis.", "Verificar: portões, cancelas e cercas (integridade e funcionamento), iluminação (avarias), cadeados e fechaduras.", "Identificar: presença de pessoas ou veículos em locais não autorizados.", "Registrar cada ronda no sistema 2 Control ou Livro de Ocorrências com horário e anomalias.", "Qualquer ocorrência de risco: comunicar imediatamente ao Líder, Supervisão e Moked."]}, {"label": "Observações", "items": ["As rondas devem ser registradas conforme procedimento interno, assegurando rastreabilidade e controle das atividades realizadas."]}]}, {"t": "h", "num": "4.2", "title": "Controle de Acesso", "lvl": 2}, {"t": "card", "title": "Acesso de Visitantes — sem pré-cadastro", "rows": [{"label": "NGA", "items": ["Nenhum visitante poderá acessar o empreendimento sem identificação documental e cadastro facial ativo no sistema."]}, {"label": "POP", "items": ["1. Receber o visitante, solicitar documento com foto, anotar nome completo e destino.", "2. Contatar o responsável do inquilino para confirmar a visita e obter autorização.", "3. Acessar o Accelero com login individual → \"Cadastro Rápido\".", "4. Tipo: \"Visita\". Campo \"Fim\": data e horário limite.", "5. \"+ Incluir\": selecionar unidade e pessoa visitada.", "6. Preencher dados completos do visitante.", "7. Capturar foto facial (iluminação, enquadramento, sem acessórios).", "8. Salvar e confirmar em \"Visitas/Agendamentos\".", "9. Orientar o visitante ao torniquete correto e monitorar pelo Log de Acesso."]}]}, {"t": "card", "title": "Acesso de Visitantes — com pré-cadastro (Link / QR Code)", "rows": [{"label": "NGA", "items": ["Nunca criar novo cadastro sem localizar o existente. Duplicatas geram conflito e negam acesso."]}, {"label": "POP", "items": ["1. Localizar evento em \"Visitas/Agendamentos\" (busca por nome, CPF ou destino) ou via \"Pesquisar QR\".", "2. Validar: unidade correta, validade (Fim) ativa, dados conferem com o documento.", "3. Verificar qualidade da foto facial. Se ausente ou inadequada, capturar nova foto.", "4. Salvar e orientar ao torniquete."]}]}, {"t": "card", "title": "Acesso de Motoristas e Veículos de Carga", "rows": [{"label": "NGA", "items": ["Captura facial do motorista é obrigatória mesmo que ele não desça do veículo."]}, {"label": "POP", "items": ["1. Solicitar documento do motorista, placa do veículo e nome da transportadora.", "2. Contatar o inquilino para confirmar agendamento e obter autorização.", "3. Cadastro Rápido no Accelero (Tipo: Visita ou Prestador).", "4. Preencher placa e transportadora nos campos correspondentes.", "5. Capturar foto facial do motorista.", "6. Definir validade (Fim) compatível com o tempo de carga/descarga.", "7. Salvar e orientar o motorista quanto à via correta (doca ou área de espera)."]}]}, {"t": "card", "title": "Plano B — Falha no Sistema Accelero", "rows": [{"label": "NGA", "items": ["Em caso de falha no sistema, nenhum acesso deve ser liberado sem registro.", "Toda entrada deve ser documentada, mesmo em modo manual."]}, {"label": "POP", "items": ["Comunicar a Moked e a Supervisão imediatamente após identificar a falha.", "Utilizar planilhas impressas: nome, CPF, placa, empresa, horário de entrada e saída.", "Designar responsável por: orientação dos usuários, verificação de autorizações, controle de entradas/saídas e arquivamento das planilhas.", "Armazenar planilhas em local seguro para posterior digitalização e envio."]}]}, {"t": "h", "num": "4.3", "title": "Procedimentos Específicos", "lvl": 2}, {"t": "card", "title": "Recebimento de Materiais e Correspondências", "rows": [{"label": "NGA", "items": ["O carteiro não poderá acessar as dependências internas. O recebimento é realizado exclusivamente pela CDA/Recepção via passa-volumes. VSPPs e CDAs estão proibidos de assinar correspondências em nome de inquilinos ou terceiros."]}, {"label": "POP", "items": ["Correspondências: receber via passa-volumes e registrar em protocolo interno.", "Comunicar o usuário/responsável do inquilino para retirada mediante assinatura.", "Volumes que não cabem no passa-volumes: direcionar ao VSPP Líder/Apoio para controle.", "Correspondências oficiais (Justiça, Receita Federal, Polícia Federal): receber diretamente pelo usuário ou Gerente do Empreendimento.", "Todo recebimento: registrar data, horário e identificação do entregador."]}]}, {"t": "card", "title": "Revistas Corporais e de Pertences", "rows": [{"label": "NGA", "items": ["Revista não é procedimento rotineiro. Somente ocorre mediante solicitação formal da Administração/Inquilino ou em caso de fundada suspeita de prática delituosa. Limita-se a inspeção visual de bolsas, mochilas e volumes."]}, {"label": "POP", "items": ["Pertences: solicitar que o próprio usuário abra seus volumes. Inspeção exclusivamente visual, sem contato físico.", "Revista pessoal (suspeita não flagrante): local reservado, mínimo de 2 agentes.", "Mulher: somente por VSPP feminina.", "Flagrante / suspeita objetiva de ilícito: revista superficial com mínimo de 2 agentes, até a chegada da autoridade policial.", "Veículos: inspeção interna somente mediante suspeita fundada ou solicitação formal.", "Toda revista deve ser registrada em relatório."]}, {"label": "Observações", "items": ["O procedimento depende de autorização expressa da Administração, salvo flagrante ou risco iminente. A atuação deve sempre observar os princípios da legalidade, proporcionalidade e preservação da integridade moral do abordado."]}]}, {"t": "card", "title": "Entrada de Pessoas Armadas", "rows": [{"label": "NGA", "items": ["Não é permitida a entrada de pessoas armadas sem identificação prévia e autorização formal. A responsabilidade pela liberação de visitante armado é do inquilino. O Gerente do Empreendimento deve ser comunicado antes da liberação."]}, {"label": "POP", "items": ["Indício de porte de arma: abordar com urbanidade e discrição, questionar se está portando armamento.", "Negativo: orientar e liberar.", "Positivo: aguardar verificação de autorização junto ao inquilino responsável.", "Escoltas de visitantes: aguardam do lado externo. Acesso às áreas comuns somente com autorização prévia do cliente.", "Autoridades em serviço oficial: tratar com urbanidade. Comunicar o Gerente e a gestão Moked/Haganá antes da liberação.", "Autoridades fora de serviço / à paisana: enquadram-se no procedimento padrão de visitante armado.", "Todo acesso de pessoa armada, mesmo autorizado, deve gerar registro em planilha e relatório formal."]}]}, {"t": "card", "title": "Cumprimento de Mandados Judiciais", "rows": [{"label": "NGA", "items": ["A verificação da documentação não caracteriza obstrução, mas cumprimento do dever de guarda. O condomínio não integra o processo judicial quando o mandado for direcionado a inquilino específico."]}, {"label": "POP", "items": ["Oficial SEM acompanhamento policial: solicitar identificação funcional e mandado, registrar o atendimento, comunicar o Gerente, Moked e Haganá e aguardar orientação antes da liberação.", "Oficial COM acompanhamento da Polícia Militar: acesso imediato. Confirmar visualmente viatura/PM e ID do Oficial, comunicar a administração e liberar sem retenções.", "Em ambos os casos: a equipe atua apenas garantindo a segurança do entorno, sem interferir na execução do mandado."]}]}, {"t": "card", "title": "Acesso de Polícia, Bombeiros, SAMU e Defesa Civil", "rows": [{"label": "NGA", "items": ["Todo acionamento de forças públicas que partir do inquilino deverá ser comunicado previamente à Administração e à Segurança. A ausência de comunicação prévia poderá gerar tempo adicional de recepção e identificação."]}, {"label": "POP", "items": ["Com comunicação prévia: preparar acesso antecipadamente, liberar na chegada, realizar escolta, informar Gerente e gestão Moked/Haganá, registrar dados da viatura e imagens pelo CCO.", "Sem comunicação prévia: recepção inicial, confirmar motivo da presença, contatar Administração ou inquilino responsável e, após validação, proceder com liberação e escolta.", "O acesso não é automático e está condicionado à identificação e validação mínima pela equipe."]}]}, {"t": "card", "title": "Reclamação de Usuários / Locatários", "rows": [{"label": "NGA", "items": ["Toda reclamação deverá ser recebida com postura profissional, imparcialidade e seriedade. Não cabe à equipe discutir, confrontar ou minimizar a reclamação.", "Toda manifestação deve ser registrada e encaminhada formalmente."]}, {"label": "POP", "items": ["Ouvir atentamente, mantendo postura técnica e respeitosa.", "Coletar informações objetivas: data, horário, local, envolvidos e descrição do fato.", "Verificar imagens ou registros quando aplicável.", "Elaborar RS e encaminhar à Moked e à Administração para ciência e tratativa."]}, {"label": "Observações", "items": ["A equipe não possui autonomia para deliberar soluções estruturais ou aplicar sanções. Sua responsabilidade é registrar, reportar e colaborar com a apuração dos fatos."]}]}, {"t": "h", "num": "4.4", "title": "Troca e Procedimento de Armamento", "lvl": 2}, {"t": "card", "title": "Troca de Armamento", "rows": [{"label": "NGA", "items": ["A troca deverá ocorrer em local previamente definido e validado pela Moked, com monitoramento por CFTV. O armamento deve permanecer desmuniciado e apontado para a Caixa de Areia durante todo o procedimento."]}, {"label": "POP", "items": ["Verificar o estado de conservação da arma. Avaria ou irregularidade: comunicar imediatamente ao Supervisor.", "O armamento somente pode ser manuseado em local seguro e direcionado à Caixa de Areia.", "Quem está armado: posicionar-se de frente para a caixa, desmuniciar e entregar a arma aberta ao companheiro.", "O companheiro: posicionar-se de frente para a caixa, verificar condições da arma, municiar e devolver ao coldre."]}, {"label": "Atenção especial", "items": ["Deve ser afixado ao lado da Caixa de Areia o passo a passo para a troca de armamento, conforme padrão Moked."]}]}, {"t": "h", "num": "4.4.1", "title": "Procedimento de Armar e Desarmar — Pistola", "lvl": 3}, {"t": "steps2", "title": "Pistola", "armar": ["Segurar a arma na mão forte, dedo fora do gatilho.", "Colocar o dedo indicador da mão fraca dentro da \"casa do carregador\", confirmando que está vazia.", "Apontar o cano para a área segura.", "Confirmar dedo fora do gatilho.", "Golpear 2x + 1x mantendo o ferrolho para trás.", "Visualizar câmara, ferrolho — ausência de munição e danos.", "Confirmar dedo fora do gatilho.", "Soltar o ferrolho.", "Apontar para área segura, inserir dedo e apertar o gatilho.", "Confirmar dedo fora do gatilho e cão fechado.", "Inserir o carregador até o final.", "Posicionar no coldre com dedo indicador fora do gatilho e polegar acima do cão."], "desarmar": ["Segurar a arma na mão forte, dedo fora do gatilho.", "Tirar o carregador e posicioná-lo entre os dedos anelar e mínimo da mão forte junto à arma.", "Colocar o dedo indicador da mão fraca dentro da \"casa do carregador\".", "Apontar o cano para a área segura.", "Confirmar dedo fora do gatilho.", "Golpear 2x + 1x mantendo o ferrolho para trás.", "Visualizar câmara, ferrolho (VSPP Apoio verifica com dedo indicador).", "Confirmar dedo fora do gatilho.", "Soltar o ferrolho.", "Apontar para área segura, inserir dedo e apertar o gatilho.", "Confirmar dedo fora do gatilho e cão fechado.", "Guardar ou passar a arma e o(s) carregador(es) separadamente."]}, {"t": "h", "num": "4.4.2", "title": "Procedimento de Armar e Desarmar — Revólver", "lvl": 3}, {"t": "steps2", "title": "Revólver", "armar": ["Segurar a arma com dedo fora do gatilho.", "Liberar o tambor girando-o totalmente aberto.", "Visualizar e confirmar que não há munição. VSPP Apoio verifica com dedo indicador.", "Fechar a arma, apontar para área segura e apertar o gatilho 3x para verificar funcionamento.", "Manter apontado para área segura, abrir o tambor e municiar.", "Conferir que todas as munições estão corretamente inseridas e fechar o tambor.", "Posicionar no coldre com dedo polegar acima do cão."], "desarmar": ["Retirar a arma do coldre com dedo fora do gatilho.", "Apontar para a área segura, abrir o tambor e desmuniciar.", "Conferir se o tambor está vazio. VSPP Apoio verifica com dedo indicador.", "Manter os dedos indicador e médio da mão fraca dentro do espaço do tambor até guarda no cofre com tambor aberto."]}, {"t": "p", "text": "O VSPP Apoio deve posicionar-se ao lado, em local com plena visualização da arma, anunciando e confirmando cada etapa. Ao final: \"arma carregada\" (coldre) ou \"arma descarregada\" (cofre). Qualquer dúvida: manter dedos fora do gatilho e contatar a supervisão."}, {"t": "h", "num": "5", "title": "Plano de Contingência", "lvl": 1}, {"t": "h", "num": "5.1", "title": "Princípios de Resposta — PUC", "lvl": 2}, {"t": "table", "title": "Fluxo único de resposta (6 etapas)", "hdr": ["Etapa", "O que fazer"], "rows": [["1. Detectar", ["Identificar o evento por meio do CFTV, ronda ou comunicação de terceiros."]], ["2. Alertar", ["Comunicar imediatamente toda a equipe via rádio HT."]], ["3. Isolar", ["Controlar acessos, impedir entradas/saídas não autorizadas."]], ["4. Agir", ["Executar o protocolo específico da ocorrência."]], ["5. Escalonar", ["Acionar Moked, Supervisão e Autoridades conforme necessário."]], ["6. Evidenciar", ["Salvar backup CFTV e elaborar RS completo."]]], "kind": "puc"}, {"t": "table", "title": "Papéis e Responsabilidades", "hdr": ["Papel", "Responsabilidade"], "rows": [["VSPP Líder", ["Coordena a equipe, toma decisões táticas, isola áreas e valida o encerramento da ocorrência."]], ["Vigilante de CCO", ["Central de informações: aciona 190/192/193, orienta a equipe via rádio e garante evidências."]], ["VSPP Apoio/Ronda", ["Controla entradas/saídas, registros manuais e condução de usuários/veículos."]]], "kind": null}, {"t": "p", "text": "Comunicação em crise: sempre responder de forma objetiva — O quê / Onde / Quem / Ação em curso / Necessidade."}, {"t": "h", "num": "5.2", "title": "Abandono — Parcial e Completo", "lvl": 2}, {"t": "card", "title": "POP — Abandono Parcial ou Completo", "rows": [{"label": "NGA", "items": ["Período diurno: o abandono somente poderá ocorrer mediante autorização expressa da Administração do Empreendimento.", "Período noturno: o VSPP Líder tem a prerrogativa de iniciar o plano de abandono, após avaliação da criticidade, mantendo contato imediato com a Administração, Moked e Haganá.", "Não há abandono sem ordem expressa e confirmada — exceto risco imediato à vida."]}, {"label": "POP", "items": ["Abandono Parcial (área específica): VSPP Líder coordena; CCO mantém monitoramento; VSPP Apoio/Ronda conduz usuários ao ponto de reunião;", "CDA/Recepção controla saídas e registra presenças.", "Abandono Completo: confirmar acionamento do alarme geral; VSPP Líder aciona autoridades (190/192/193); CCO mantém backup CFTV ativo; equipe conduz usuários ao ponto de reunião externo.", "Evacuação de grande fluxo: utilizar exclusivamente portões e vias de acesso.", "Portões totalmente abertos.", "Veículos permanecem parados durante a evacuação de pedestres.", "Retomada da operação: somente após liberação das autoridades competentes ou autorização da Administração."]}, {"label": "Observações", "items": ["Toda a ação deve ser evidenciada (CFTV, relatórios, registros manuais) e relatada em RS e Livro de Ocorrências. Relatório encaminhado à Moked em até 24 horas após o encerramento."]}]}, {"t": "h", "num": "5.3", "title": "Roteiros de Crise", "lvl": 2}, {"t": "p", "text": "Cada ocorrência deve seguir o protocolo correspondente, respeitando os princípios gerais do PUC. Em todas as situações: preservar vidas em primeiro lugar, seguido da integridade das instalações. Nenhuma ação deve ser tomada sem comunicação com o VSPP Líder ou o CCO."}, {"t": "table", "title": "Acidente Interno com Vítimas", "hdr": ["Função / Posto", "Ação esperada", "Quando"], "rows": [["VSPP Líder", ["Alertar imediatamente toda a equipe via rádio HT informando local e natureza do acidente.", "Prestar primeiros socorros se habilitado, enquanto aguarda a chegada do resgate.", "Após estabilizar a situação, colher dados básicos e informar Supervisão e Moked."], ["Imediatamente após identificar"]], ["Vigilante de CCO", ["Informar o Gerente do Empreendimento após comunicação à Supervisão.", "Acionar o resgate via telefone institucional: SAMU (192) ou Bombeiros (193), informando endereço, número do galpão e estado da vítima.", "Focar câmeras no local, gravar imagens e registrar ocorrência em RS."], ["Imediatamente"]], ["VSPP Apoio/Ronda", ["Controlar e agilizar o acesso do resgate ao local na chegada das equipes externas.", "Afastar curiosos e garantir área livre para atuação do socorro.", "Prestar apoio no local quando solicitado pela liderança."], ["Na chegada do resgate"]], ["CDA / Recepção", ["Manter atendimento normal com porta segura.", "Cumprir orientações da liderança e estar pronto para direcionar o resgate."], ["Durante toda a ocorrência"]]], "kind": "crise"}, {"t": "table", "title": "Acidente Externo com Vítimas", "hdr": ["Função / Posto", "Ação esperada", "Quando"], "rows": [["VSPP Líder", ["Tomar conhecimento da situação e informar Moked e Supervisor imediatamente.", "Ficar atento e não se envolver diretamente no acidente externo.", "Deslocar-se ao local somente quando direcionado pelo CCO ou Supervisão.", "Informar o Gerente do Empreendimento ao finalizar."], ["Imediatamente"]], ["Vigilante de CCO", ["Chamar o resg
