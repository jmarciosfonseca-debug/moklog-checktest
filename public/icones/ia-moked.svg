<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filtros de relevo 3D, sombras volumétricas e emissão neon -->
    <filter id="mok-shadow-deep" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="18" stdDeviation="16" flood-color="#0A0101" flood-opacity="0.95"/>
    </filter>

    <filter id="mok-shadow-wing" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-6" dy="14" stdDeviation="12" flood-color="#050000" flood-opacity="0.9"/>
    </filter>

    <filter id="mok-glow-red" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#F87171" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#EF4444" flood-opacity="0.55"/>
    </filter>

    <filter id="mok-core-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#FFFFFF" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#EF4444" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="40" flood-color="#B91C1C" flood-opacity="0.6"/>
    </filter>

    <!-- Base da placa de vidro fosco escuro com matiz carmesim/obsidiana -->
    <linearGradient id="mok-glass-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240A0A" stop-opacity="0.96"/>
      <stop offset="45%" stop-color="#150505" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#0A0202" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Brilho volumétrico interno carmesim no canto superior esquerdo -->
    <radialGradient id="mok-glass-glow" cx="22%" cy="18%" r="75%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#991B1B" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#150505" stop-opacity="0"/>
    </radialGradient>

    <!-- Rim light chanfrado da borda externa da placa -->
    <linearGradient id="mok-rim-border" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FEE2E2" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#F87171" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#DC2626" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#450A0A" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Reflexo especular diagonal superior do vidro -->
    <linearGradient id="mok-specular-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#FCA5A5" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Gradientes 3D das Asas Laterais em Titânio / Aço Grafite Escuro -->
    <linearGradient id="mok-wing-metal" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#3A3F47"/>
      <stop offset="30%" stop-color="#262A31"/>
      <stop offset="70%" stop-color="#181B20"/>
      <stop offset="100%" stop-color="#0D0E12"/>
    </linearGradient>

    <linearGradient id="mok-wing-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#64748B" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Gradientes 3D dos Segmentos Vermelhos do Núcleo Moked -->
    <linearGradient id="mok-lens-red" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FCA5A5"/>
      <stop offset="25%" stop-color="#EF4444"/>
      <stop offset="65%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>

    <linearGradient id="mok-lens-rim" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FECACA" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#991B1B" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Fundo da Cavidade Óptica Interna -->
    <radialGradient id="mok-lens-core-bg" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#350B0B" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#1D0505" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0B0101" stop-opacity="0.98"/>
    </radialGradient>

    <!-- Setor de Varredura do Radar -->
    <linearGradient id="mok-radar-sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#EF4444" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7F1D1D" stop-opacity="0"/>
    </linearGradient>

    <!-- Ponto Focal Moked (Gradiente da Esfera Central) -->
    <radialGradient id="mok-focal-core" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FEE2E2"/>
      <stop offset="60%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </radialGradient>

    <!-- Máscara estrita para confinar 100% de luz dentro da placa -->
    <clipPath id="mok-plaque-clip">
      <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75"/>
    </clipPath>

    <!-- Máscara circular da cavidade óptica interna -->
    <clipPath id="mok-lens-clip">
      <circle cx="512" cy="512" r="162"/>
    </clipPath>
  </defs>

  <!-- GRUPO PRINCIPAL CONFINADO NA PLACA DE VIDRO -->
  <g clip-path="url(#mok-plaque-clip)">
    <!-- Fundo de vidro fosco escuro -->
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#mok-glass-base)"/>

    <!-- Brilho volumétrico interno carmesim -->
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#mok-glass-glow)"/>

    <!-- Reflexo especular diagonal superior (luz do alto à esquerda) -->
    <path d="M 51.2 51.2 L 972.8 51.2 L 972.8 380 L 51.2 580 Z" fill="url(#mok-specular-top)"/>

    <!-- RETÍCULA TÁTICA DE PRECISÃO MOKED AO FUNDO -->
    <g opacity="0.3">
      <circle cx="512" cy="512" r="280" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="10 8"/>
      <circle cx="512" cy="512" r="225" fill="none" stroke="#F87171" stroke-width="1.5"/>
      <line x1="140" y1="512" x2="884" y2="512" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.4"/>
      <line x1="512" y1="140" x2="512" y2="884" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.4"/>
    </g>

    <!-- EMBLEMA PRINCIPAL MOKED 3D -->
    <g id="mok-symbol-group">

      <!-- 1. ASAS LATERAIS EM TITÂNIO ESCURO (OS ELOS EXTERNOS DO EMBLEMA) -->
      <g filter="url(#mok-shadow-wing)">
        <!-- Asa Esquerda (Elo com hastes horizontais projetadas para a esquerda) -->
        <path d="M 270 412 
                 C 200 412, 140 452, 140 512 
                 C 140 572, 200 612, 270 612 
                 L 336 612 
                 L 336 556 
                 L 270 556 
                 C 232 556, 196 538, 196 512 
                 C 196 486, 232 468, 270 468 
                 L 336 468 
                 L 336 412 Z" 
              fill="url(#mok-wing-metal)" stroke="url(#mok-wing-rim)" stroke-width="6" stroke-linejoin="round"/>
        <!-- Hastes duplas horizontais que prolongam a asa esquerda -->
        <rect x="76" y="474" width="70" height="22" rx="4" ry="4" 
              fill="url(#mok-wing-metal)" stroke="url(#mok-wing-rim)" stroke-width="4"/>
        <rect x="76" y="528" width="70" height="22" rx="4" ry="4" 
              fill="url(#mok-wing-metal)" stroke="url(#mok-wing-rim)" stroke-width="4"/>
        <!-- Friso biselado de luz interior na asa esquerda -->
        <path d="M 270 422 C 208 422, 152 460, 152 512 C 152 564, 208 602, 270 602" 
              fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.35"/>

        <!-- Asa Direita (Espelhamento simétrico com hastes projetadas para a direita) -->
        <path d="M 754 412 
                 C 824 412, 884 452, 884 512 
                 C 884 572, 824 612, 754 612 
                 L 688 612 
                 L 688 556 
                 L 754 556 
                 C 792 556, 828 538, 828 512 
                 C 828 486, 792 468, 754 468 
                 L 688 468 
                 L 688 412 Z" 
              fill="url(#mok-wing-metal)" stroke="url(#mok-wing-rim)" stroke-width="6" stroke-linejoin="round"/>
        <!-- Hastes duplas horizontais que prolongam a asa direita -->
        <rect x="878" y="474" width="70" height="22" rx="4" ry="4" 
              fill="url(#mok-wing-metal)" stroke="url(#mok-wing-rim)" stroke-width="4"/>
        <rect x="878" y="528" width="70" height="22" rx="4" ry="4" 
              fill="url(#mok-wing-metal)" stroke="url(#mok-wing-rim)" stroke-width="4"/>
        <!-- Friso biselado de luz interior na asa direita -->
        <path d="M 754 422 C 816 422, 872 460, 872 512 C 872 564, 816 602, 754 602" 
              fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.35"/>
      </g>

      <!-- 2. CAVIDADE ÓPTICA INTERNA DA LENTE -->
      <g filter="url(#mok-shadow-deep)">
        <circle cx="512" cy="512" r="176" fill="url(#mok-lens-core-bg)"/>
      </g>

      <!-- Elementos Táticos dentro da Cavidade (Varredura, Retícula e Pulso ECG) -->
      <g clip-path="url(#mok-lens-clip)">
        <!-- Setor de Varredura Angular do Radar -->
        <path d="M 512 512 L 476 348 A 164 164 0 0 1 668 456 Z" fill="url(#mok-radar-sweep)"/>

        <!-- Anéis e Eixos Internos de Calibração -->
        <circle cx="512" cy="512" r="124" fill="none" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
        <circle cx="512" cy="512" r="76" fill="none" stroke="#FCA5A5" stroke-width="2" opacity="0.5"/>
        <line x1="348" y1="512" x2="676" y2="512" stroke="#DC2626" stroke-width="1.5" stroke-opacity="0.3"/>
        <line x1="512" y1="348" x2="512" y2="676" stroke="#DC2626" stroke-width="1.5" stroke-opacity="0.3"/>

        <!-- Linha de Pulso de Segurança (ECG) Cruzando a Lente Horizontalmente -->
        <g filter="url(#mok-glow-red)">
          <path d="M 348 512 
                   L 426 512 
                   L 438 486 
                   L 450 536 
                   L 462 468 
                   L 474 512 
                   L 550 512 
                   L 562 480 
                   L 574 542 
                   L 586 490 
                   L 598 512 
                   L 676 512" 
                fill="none" stroke="#FCA5A5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
        </g>
      </g>

      <!-- 3. NÚCLEO CENTRAL VERMELHO EM 4 QUADRANTES COM HASTES VERTICAIS DE MIRA -->
      <g filter="url(#mok-shadow-deep)">

        <!-- QUADRANTE SUPERIOR ESQUERDO -->
        <path d="M 494 200 
                 L 434 200 
                 L 434 322 
                 C 370 348, 322 410, 310 494 
                 L 386 494 
                 C 396 442, 440 398, 494 386 Z" 
              fill="url(#mok-lens-red)" stroke="url(#mok-lens-rim)" stroke-width="5" stroke-linejoin="round"/>
        <path d="M 440 206 L 490 206 L 490 380 C 444 394, 404 434, 392 488" 
              fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.5"/>

        <!-- QUADRANTE SUPERIOR DIREITO -->
        <path d="M 530 200 
                 L 590 200 
                 L 590 322 
                 C 654 348, 702 410, 714 494 
                 L 638 494 
                 C 628 442, 584 398, 530 386 Z" 
              fill="url(#mok-lens-red)" stroke="url(#mok-lens-rim)" stroke-width="5" stroke-linejoin="round"/>
        <path d="M 534 206 L 584 206 L 584 316 C 640 342, 682 396, 698 460" 
              fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.4"/>

        <!-- QUADRANTE INFERIOR ESQUERDO -->
        <path d="M 310 530 
                 C 322 614, 370 676, 434 702 
                 L 434 824 
                 L 494 824 
                 L 494 638 
                 C 440 626, 396 582, 386 530 Z" 
              fill="url(#mok-lens-red)" stroke="url(#mok-lens-rim)" stroke-width="5" stroke-linejoin="round"/>

        <!-- QUADRANTE INFERIOR DIREITO -->
        <path d="M 714 530 
                 C 702 614, 654 676, 590 702 
                 L 590 824 
                 L 530 824 
                 L 530 638 
                 C 584 626, 628 582, 638 530 Z" 
              fill="url(#mok-lens-red)" stroke="url(#mok-lens-rim)" stroke-width="5" stroke-linejoin="round"/>
      </g>

      <!-- Haste Luminosa Central Superior e Inferior (Extensões da Mira Neon) -->
      <g filter="url(#mok-glow-red)">
        <rect x="494" y="200" width="36" height="12" fill="#FFFFFF" opacity="0.9"/>
        <rect x="494" y="812" width="36" height="12" fill="#FFFFFF" opacity="0.9"/>
      </g>

      <!-- 4. PONTO FOCAL CENTRAL (O PONTO MOKED / NÚCLEO DE INTENSIDADE MÁXIMA) -->
      <g filter="url(#mok-core-glow)">
        <circle cx="512" cy="512" r="48" fill="#1A0303" stroke="#FCA5A5" stroke-width="4"/>
        <circle cx="512" cy="512" r="38" fill="url(#mok-focal-core)" stroke="#FFFFFF" stroke-width="3"/>
        <circle cx="512" cy="512" r="20" fill="#FFFFFF"/>
        <ellipse cx="504" cy="504" rx="7" ry="4" fill="#FFFFFF" opacity="0.9" transform="rotate(-30 504 504)"/>
      </g>

    </g>

    <!-- Friso de luz interno no bisel superior da placa de vidro -->
    <rect x="55.2" y="55.2" width="913.6" height="913.6" rx="198.75" ry="198.75" 
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.25"/>
  </g>

  <!-- BORDA DE LUZ EXTERNA (RIM LIGHT DA PLACA) - ZERO VAZAMENTO -->
  <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75" 
        fill="none" stroke="url(#mok-rim-border)" stroke-width="7"/>
</svg>
