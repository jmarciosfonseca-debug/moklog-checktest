<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filtros de relevo 3D e profundidade -->
    <filter id="reg-shadow-board" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="16" stdDeviation="15" flood-color="#1A0D00" flood-opacity="0.85"/>
    </filter>

    <filter id="reg-shadow-sheet" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-6" dy="12" stdDeviation="10" flood-color="#0F0800" flood-opacity="0.75"/>
    </filter>

    <filter id="reg-shadow-check" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>

    <!-- Base de vidro fosco escuro com matiz âmbar -->
    <linearGradient id="reg-glass-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C140A" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#140E05" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#080501" stop-opacity="0.97"/>
    </linearGradient>

    <!-- Brilho volumétrico interno âmbar da placa -->
    <radialGradient id="reg-glass-glow" cx="25%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#B45309" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Rim light chanfrado da borda externa -->
    <linearGradient id="reg-rim-border" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#F59E0B" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#B45309" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#451A03" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Reflexo especular superior do vidro -->
    <linearGradient id="reg-specular-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#FCD34D" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Gradiente 3D da Prancheta Base -->
    <linearGradient id="reg-board-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="40%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <linearGradient id="reg-board-rim" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Gradiente da Folha em Relevo -->
    <linearGradient id="reg-sheet-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Gradiente 3D do Check (Tick de Conformidade) -->
    <linearGradient id="reg-check-grad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FDE68A"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Máscara estrita para confinar 100% de luz dentro da placa -->
    <clipPath id="reg-plaque-clip">
      <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75"/>
    </clipPath>
  </defs>

  <!-- GRUPO PRINCIPAL CONFINADO NA PLACA -->
  <g clip-path="url(#reg-plaque-clip)">
    <!-- Fundo de vidro fosco escuro -->
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#reg-glass-base)"/>

    <!-- Brilho volumétrico interno âmbar -->
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#reg-glass-glow)"/>

    <!-- Reflexo especular diagonal superior -->
    <path d="M 51.2 51.2 L 972.8 51.2 L 972.8 380 L 51.2 580 Z" fill="url(#reg-specular-top)"/>

    <!-- SÍMBOLO RELEVO 3D: REGISTRO SITUACIONAL -->
    <g id="reg-symbol-group">
      <!-- 1. CORPO DA PRANCHETA (BASE RÍGIDA) -->
      <g filter="url(#reg-shadow-board)">
        <rect x="272" y="220" width="480" height="610" rx="36" ry="36" 
              fill="url(#reg-board-grad)" stroke="url(#reg-board-rim)" stroke-width="8"/>
        <!-- Detalhe superior da prancheta (borda de luz chanfrada) -->
        <rect x="286" y="234" width="452" height="32" rx="14" ry="14" 
              fill="#FFFFFF" opacity="0.18"/>
      </g>

      <!-- 2. FOLHA EM RELEVO LISO -->
      <g filter="url(#reg-shadow-sheet)">
        <rect x="316" y="292" width="392" height="498" rx="18" ry="18" 
              fill="url(#reg-sheet-grad)" stroke="#FEF3C7" stroke-width="4" stroke-opacity="0.8"/>
        <!-- Reflexo suave no topo da folha -->
        <rect x="328" y="304" width="368" height="26" rx="8" ry="8" 
              fill="#FFFFFF" opacity="0.25"/>
      </g>

      <!-- 3. CLIPE / PRESILHA METÁLICA SUPERIOR (DETALHE SECUNDÁRIO CINZA-AZULADO) -->
      <rect x="422" y="180" width="180" height="76" rx="18" ry="18" 
            fill="#334155" stroke="#94A3B8" stroke-width="6"/>
      <!-- Friso de aperto do clipe -->
      <rect x="456" y="200" width="112" height="18" rx="9" ry="9" 
            fill="#0F172A" stroke="#94A3B8" stroke-width="3"/>

      <!-- 4. CHECK DE CONFORMIDADE (VOLUME 3D EM ALTO RELEVO) -->
      <g filter="url(#reg-shadow-check)">
        <path d="M 436 672 L 358 594 C 344 580, 344 558, 358 544 C 372 530, 394 530, 408 544 L 458 594 L 626 426 C 640 412, 662 412, 676 426 C 690 440, 690 462, 676 476 L 478 674 C 466 686, 448 686, 436 672 Z" 
              fill="url(#reg-check-grad)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Friso de luz interno no bisel superior -->
    <rect x="55.2" y="55.2" width="913.6" height="913.6" rx="198.75" ry="198.75" 
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.25"/>
  </g>

  <!-- BORDA DE LUZ EXTERNA (RIM LIGHT DA PLACA) - ZERO VAZAMENTO -->
  <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75" 
        fill="none" stroke="url(#reg-rim-border)" stroke-width="7"/>
</svg>
