<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filtros de relevo 3D, emissão de luz e profundidade -->
    <filter id="luz-shadow-bulb" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="16" stdDeviation="16" flood-color="#1A1200" flood-opacity="0.88"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#EAB308" flood-opacity="0.45"/>
    </filter>

    <filter id="luz-beam-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- Base de vidro fosco escuro com matiz âmbar/dourado -->
    <linearGradient id="luz-glass-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1508" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#120E04" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#080601" stop-opacity="0.97"/>
    </linearGradient>

    <!-- Brilho volumétrico interno amarelo da placa -->
    <radialGradient id="luz-glass-glow" cx="25%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#CA8A04" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0"/>
    </radialGradient>

    <!-- Rim light chanfrado da borda externa -->
    <linearGradient id="luz-rim-border" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FEF9C3" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#EAB308" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#CA8A04" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#713F12" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Reflexo especular superior do vidro -->
    <linearGradient id="luz-specular-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#FDE047" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Gradiente 3D do Bulbo da Lâmpada -->
    <linearGradient id="luz-bulb-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#FACC15"/>
      <stop offset="70%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>

    <linearGradient id="luz-bulb-rim" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FEF08A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#CA8A04" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Gradiente do Feixe de Luz Volumétrico -->
    <linearGradient id="luz-beam-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#FACC15" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0"/>
    </linearGradient>

    <!-- Gradiente da Base Rosqueada (Cinza-azulado) -->
    <linearGradient id="luz-base-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Máscara estrita para confinar 100% de luz dentro da placa -->
    <clipPath id="luz-plaque-clip">
      <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75"/>
    </clipPath>
  </defs>

  <!-- GRUPO PRINCIPAL CONFINADO NA PLACA -->
  <g clip-path="url(#luz-plaque-clip)">
    <!-- Fundo de vidro fosco escuro -->
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#luz-glass-base)"/>

    <!-- Brilho volumétrico interno amarelo -->
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#luz-glass-glow)"/>

    <!-- Reflexo especular diagonal superior -->
    <path d="M 51.2 51.2 L 972.8 51.2 L 972.8 380 L 51.2 580 Z" fill="url(#luz-specular-top)"/>

    <!-- SÍMBOLO RELEVO 3D: LÂMPADA COM FEIXE DE LUZ -->
    <g id="luz-symbol-group">
      <!-- 1. FEIXE DE LUZ EXPANSIVO (CONTIDO DENTRO DA PLACA) -->
      <path d="M 436 430 L 230 790 L 794 790 L 588 430 Z" 
            fill="url(#luz-beam-grad)" filter="url(#luz-beam-glow)"/>

      <!-- 2. BULBO DA LÂMPADA EM RELEVO 3D MACIÇO -->
      <g filter="url(#luz-shadow-bulb)">
        <!-- Silhueta da lâmpada: esfera superior afunilando para o pescoço -->
        <path d="M 512 185 C 408 185, 324 269, 324 373 C 324 445, 365 507, 426 539 L 426 605 C 426 617, 436 627, 448 627 L 576 627 C 588 627, 598 617, 598 605 L 598 539 C 659 507, 700 445, 700 373 C 700 269, 616 185, 512 185 Z" 
              fill="url(#luz-bulb-grad)" stroke="url(#luz-bulb-rim)" stroke-width="8" stroke-linejoin="round"/>
        <!-- Reflexo especular volumétrico no topo do bulbo -->
        <ellipse cx="460" cy="255" rx="58" ry="32" fill="#FFFFFF" opacity="0.32" transform="rotate(-30 460 255)"/>
      </g>

      <!-- 3. FILAMENTO INTERNO INCANDESCENTE (CONTIDO DENTRO DO BULBO) -->
      <path d="M 462 410 L 487 340 L 512 375 L 537 340 L 562 410" 
            fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
      <circle cx="512" cy="375" r="9" fill="#FFFFFF"/>

      <!-- 4. BASE ROSQUEADA METÁLICA (DETALHE SECUNDÁRIO CINZA-AZULADO) -->
      <!-- Rosca 1 -->
      <rect x="438" y="637" width="148" height="26" rx="10" ry="10" 
            fill="url(#luz-base-grad)" stroke="#94A3B8" stroke-width="4"/>
      <!-- Rosca 2 -->
      <rect x="444" y="671" width="136" height="26" rx="10" ry="10" 
            fill="url(#luz-base-grad)" stroke="#94A3B8" stroke-width="4"/>
      <!-- Contato Elétrico Inferior -->
      <path d="M 466 705 C 466 725, 558 725, 558 705 Z" 
            fill="#1E293B" stroke="#94A3B8" stroke-width="4"/>
    </g>

    <!-- Friso de luz interno no bisel superior -->
    <rect x="55.2" y="55.2" width="913.6" height="913.6" rx="198.75" ry="198.75" 
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.25"/>
  </g>

  <!-- BORDA DE LUZ EXTERNA (RIM LIGHT DA PLACA) - ZERO VAZAMENTO -->
  <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75" 
        fill="none" stroke="url(#luz-rim-border)" stroke-width="7"/>
</svg>
