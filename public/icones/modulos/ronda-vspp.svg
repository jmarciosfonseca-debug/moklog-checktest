<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filtros de relevo 3D, feixe de farol e profundidade -->
    <filter id="vspp-shadow-car" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="16" stdDeviation="15" flood-color="#021A0F" flood-opacity="0.88"/>
    </filter>

    <filter id="vspp-headlight-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <filter id="vspp-light-source" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#A7F3D0" flood-opacity="0.95"/>
    </filter>

    <!-- Base de vidro fosco escuro com matiz verde-esmeralda -->
    <linearGradient id="vspp-glass-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071F14" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#04170E" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#010A05" stop-opacity="0.97"/>
    </linearGradient>

    <!-- Brilho volumétrico interno verde-esmeralda da placa -->
    <radialGradient id="vspp-glass-glow" cx="25%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#047857" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Rim light chanfrado da borda externa -->
    <linearGradient id="vspp-rim-border" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#D1FAE5" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#10B981" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#047857" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Reflexo especular superior do vidro -->
    <linearGradient id="vspp-specular-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#6EE7B7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Gradientes 3D da Carroceria da Viatura (Vista 3/4) -->
    <linearGradient id="vspp-body-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="35%" stop-color="#059669"/>
      <stop offset="75%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <linearGradient id="vspp-body-rim" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#6EE7B7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Gradiente dos Vidros / Parabrisa (Cinza-azulado com reflexo) -->
    <linearGradient id="vspp-windshield-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Gradiente dos Feixes do Farol -->
    <linearGradient id="vspp-beam-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ECFDF5" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#A7F3D0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>

    <!-- Máscara estrita para confinar 100% de luz dentro da placa -->
    <clipPath id="vspp-plaque-clip">
      <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75"/>
    </clipPath>
  </defs>

  <!-- GRUPO PRINCIPAL CONFINADO NA PLACA -->
  <g clip-path="url(#vspp-plaque-clip)">
    <!-- Fundo de vidro fosco escuro -->
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#vspp-glass-base)"/>

    <!-- Brilho volumétrico interno verde-esmeralda -->
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#vspp-glass-glow)"/>

    <!-- Reflexo especular diagonal superior -->
    <path d="M 51.2 51.2 L 972.8 51.2 L 972.8 380 L 51.2 580 Z" fill="url(#vspp-specular-top)"/>

    <!-- SÍMBOLO RELEVO 3D: RONDA VSPP (VIATURA 3/4 COM FAROL ACESO) -->
    <g id="vspp-symbol-group">
      <!-- 1. FEIXES DE LUZ DOS FARÓIS (PROJETADOS PARA A DIREITA / FRENTE) -->
      <polygon points="685,550 860,505 875,620 685,595" 
               fill="url(#vspp-beam-grad)" filter="url(#vspp-headlight-glow)"/>
      <polygon points="590,565 790,595 780,680 590,610" 
               fill="url(#vspp-beam-grad)" filter="url(#vspp-headlight-glow)"/>

      <!-- 2. CORPO DA VIATURA EM PERSPECTIVA 3/4 (MASSA SÓLIDA CHANFRADA) -->
      <g filter="url(#vspp-shadow-car)">
        <!-- Carroceria Principal -->
        <path d="M 235 565 
                 L 315 425 
                 C 325 410, 345 400, 365 400 
                 L 540 400 
                 C 560 400, 580 412, 595 430 
                 L 660 515 
                 L 730 545 
                 C 745 552, 755 565, 755 582 
                 L 755 640 
                 C 755 655, 742 665, 725 665 
                 L 695 665 
                 C 690 615, 645 580, 595 580 
                 C 545 580, 500 615, 495 665 
                 L 355 665 
                 C 350 615, 305 580, 255 580 
                 C 240 580, 226 585, 215 595 
                 L 215 585 
                 C 215 572, 223 566, 235 565 Z" 
              fill="url(#vspp-body-grad)" stroke="url(#vspp-body-rim)" stroke-width="8" stroke-linejoin="round"/>

        <!-- Teto / Friso de Luz Superior -->
        <path d="M 360 415 L 545 415 C 555 415, 568 422, 578 435 L 638 510 L 325 510 Z" 
              fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.3"/>

        <!-- Parabrisa Dianteiro e Janela Lateral (Cabine) -->
        <!-- Janela Lateral Traseira/Central -->
        <path d="M 335 500 L 380 430 L 465 430 L 465 500 Z" 
              fill="url(#vspp-windshield-grad)" stroke="#94A3B8" stroke-width="4"/>
        <!-- Parabrisa Frontal (Angulado em 3/4) -->
        <path d="M 485 500 L 485 430 L 545 430 L 620 500 Z" 
              fill="url(#vspp-windshield-grad)" stroke="#94A3B8" stroke-width="4"/>

        <!-- Rodas e Caixas de Roda (Cinza-Azulado com Cubo Verde) -->
        <!-- Roda Traseira -->
        <circle cx="260" cy="665" r="48" fill="#0F172A" stroke="#94A3B8" stroke-width="6"/>
        <circle cx="260" cy="665" r="22" fill="#334155" stroke="#10B981" stroke-width="4"/>
        <!-- Roda Dianteira -->
        <circle cx="600" cy="665" r="48" fill="#0F172A" stroke="#94A3B8" stroke-width="6"/>
        <circle cx="600" cy="665" r="22" fill="#334155" stroke="#10B981" stroke-width="4"/>

        <!-- Para-choque Dianteiro e Grade -->
        <path d="M 725 615 L 755 615 L 755 645 L 715 645 Z" fill="#1E293B" stroke="#94A3B8" stroke-width="4"/>

        <!-- Giroflex Tático no Teto (Luz de Patrulhamento VSPP) -->
        <rect x="425" y="375" width="55" height="20" rx="8" ry="8" 
              fill="#10B981" stroke="#D1FAE5" stroke-width="4"/>
      </g>

      <!-- 3. BLOCO ÓPTICO DO FAROL (EMISSÃO POTENTE) -->
      <!-- Farol Principal Direito (Frontal em 3/4) -->
      <g filter="url(#vspp-light-source)">
        <polygon points="695,555 745,570 740,600 685,585" 
                 fill="#FFFFFF" stroke="#A7F3D0" stroke-width="3"/>
        <ellipse cx="718" cy="578" rx="16" ry="10" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Friso de luz interno no bisel superior -->
    <rect x="55.2" y="55.2" width="913.6" height="913.6" rx="198.75" ry="198.75" 
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.25"/>
  </g>

  <!-- BORDA DE LUZ EXTERNA (RIM LIGHT DA PLACA) - ZERO VAZAMENTO -->
  <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75" 
        fill="none" stroke="url(#vspp-rim-border)" stroke-width="7"/>
</svg>
