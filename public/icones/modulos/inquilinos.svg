<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filtros de relevo 3D e profundidade -->
    <filter id="galp-shadow-main" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="16" stdDeviation="15" flood-color="#021417" flood-opacity="0.88"/>
    </filter>

    <filter id="galp-shadow-dock" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="8" stdDeviation="6" flood-color="#010A0C" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#06B6D4" flood-opacity="0.4"/>
    </filter>

    <!-- Base de vidro fosco escuro com matiz ciano -->
    <linearGradient id="galp-glass-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081E24" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#041419" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#01090C" stop-opacity="0.97"/>
    </linearGradient>

    <!-- Brilho volumétrico interno ciano da placa -->
    <radialGradient id="galp-glass-glow" cx="25%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#0891B2" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <!-- Rim light chanfrado da borda externa -->
    <linearGradient id="galp-rim-border" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#CFFAFE" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#06B6D4" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#0891B2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#164E63" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Reflexo especular superior do vidro -->
    <linearGradient id="galp-specular-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#67E8F9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Gradientes 3D do Galpão Logístico Principal -->
    <linearGradient id="galp-body-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="35%" stop-color="#0891B2"/>
      <stop offset="75%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#155E75"/>
    </linearGradient>

    <linearGradient id="galp-body-rim" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ECFEFF" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#67E8F9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0E7490" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Gradiente da Platibanda / Cobertura Shed -->
    <linearGradient id="galp-roof-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Gradientes das Docas / Portões Seccionados -->
    <linearGradient id="galp-dock-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Máscara estrita para confinar 100% de luz dentro da placa -->
    <clipPath id="galp-plaque-clip">
      <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75"/>
    </clipPath>
  </defs>

  <!-- GRUPO PRINCIPAL CONFINADO NA PLACA -->
  <g clip-path="url(#galp-plaque-clip)">
    <!-- Fundo de vidro fosco escuro -->
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#galp-glass-base)"/>

    <!-- Brilho volumétrico interno ciano -->
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#galp-glass-glow)"/>

    <!-- Reflexo especular diagonal superior -->
    <path d="M 51.2 51.2 L 972.8 51.2 L 972.8 380 L 51.2 580 Z" fill="url(#galp-specular-top)"/>

    <!-- SÍMBOLO RELEVO 3D: GALPÃO LOGÍSTICO COM PORTAS DE DOCA -->
    <g id="galp-symbol-group">
      <!-- 1. CORPO PRINCIPAL DO GALPÃO LOGÍSTICO (RELEVO 3D MASSIÇO) -->
      <g filter="url(#galp-shadow-main)">
        <!-- Silhueta frontal de galpão industrial com cumeeira/platibanda -->
        <path d="M 512 215 
                 L 775 320 
                 C 788 325, 796 338, 796 352 
                 L 796 795 
                 C 796 812, 782 825, 765 825 
                 L 259 825 
                 C 242 825, 228 812, 228 795 
                 L 228 352 
                 C 228 338, 236 325, 249 320 Z" 
              fill="url(#galp-body-grad)" stroke="url(#galp-body-rim)" stroke-width="8" stroke-linejoin="round"/>

        <!-- Platibanda e Beiral Superior com Iluminação (Linha de Destaque) -->
        <path d="M 240 338 L 512 235 L 784 338 L 784 365 L 512 262 L 240 365 Z" 
              fill="url(#galp-roof-grad)" fill-opacity="0.35" stroke="#FFFFFF" stroke-width="3" opacity="0.8"/>
      </g>

      <!-- 2. MARQUISE DAS DOCAS (PROJEÇÃO HORIZONTAL DE PROTEÇÃO DE CARGA) -->
      <rect x="258" y="475" width="508" height="22" rx="6" ry="6" 
            fill="#334155" stroke="#94A3B8" stroke-width="4"/>

      <!-- 3. DOCAS SECCIONADAS EM ALTO RELEVO (TRÊS PORTÕES INDUSTRIAIS) -->
      <!-- Doca 01 (Esquerda) -->
      <g filter="url(#galp-shadow-dock)">
        <rect x="290" y="525" width="118" height="270" rx="12" ry="12" 
              fill="url(#galp-dock-grad)" stroke="#06B6D4" stroke-width="6"/>
        <!-- Frisos das lâminas da porta seccionada -->
        <line x1="298" y1="580" x2="400" y2="580" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
        <line x1="298" y1="635" x2="400" y2="635" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
        <line x1="298" y1="690" x2="400" y2="690" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
        <line x1="298" y1="745" x2="400" y2="745" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
        <!-- Nivelador de Doca / Batente Inferior -->
        <rect x="298" y="780" width="102" height="15" fill="#0891B2"/>
      </g>

      <!-- Doca 02 (Central) -->
      <g filter="url(#galp-shadow-dock)">
        <rect x="453" y="525" width="118" height="270" rx="12" ry="12" 
              fill="url(#galp-dock-grad)" stroke="#06B6D4" stroke-width="6"/>
        <!-- Frisos das lâminas da porta seccionada -->
        <line x1="461" y1="580" x2="563" y2="580" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
        <line x1="461" y1="635" x2="563" y2="635" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
        <line x1="461" y1="690" x2="563" y2="690" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
        <line x1="461" y1="745" x2="563" y2="745" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
        <!-- Nivelador de Doca / Batente Inferior -->
        <rect x="461" y="780" width="102" height="15" fill="#0891B2"/>
      </g>

      <!-- Doca 03 (Direita) -->
      <g filter="url(#galp-shadow-dock)">
        <rect x="616" y="525" width="118" height="270" rx="12" ry="12" 
              fill="url(#galp-dock-grad)" stroke="#06B6D4" stroke-width="6"/>
        <!-- Frisos das lâminas da porta seccionada -->
        <line x1="624" y1="580" x2="726" y2="580" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
        <line x1="624" y1="635" x2="726" y2="635" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
        <line x1="624" y1="690" x2="726" y2="690" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
        <line x1="624" y1="745" x2="726" y2="745" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
        <!-- Nivelador de Doca / Batente Inferior -->
        <rect x="624" y="780" width="102" height="15" fill="#0891B2"/>
      </g>
    </g>

    <!-- Friso de luz interno no bisel superior -->
    <rect x="55.2" y="55.2" width="913.6" height="913.6" rx="198.75" ry="198.75" 
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.25"/>
  </g>

  <!-- BORDA DE LUZ EXTERNA (RIM LIGHT DA PLACA) - ZERO VAZAMENTO -->
  <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75" 
        fill="none" stroke="url(#galp-rim-border)" stroke-width="7"/>
</svg>
