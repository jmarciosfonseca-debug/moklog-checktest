<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filtros de relevo 3D e profundidade -->
    <filter id="equip-shadow-shield" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="16" stdDeviation="15" flood-color="#1A0A02" flood-opacity="0.85"/>
    </filter>

    <filter id="equip-shadow-gear" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="14" stdDeviation="12" flood-color="#0F0401" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#F97316" flood-opacity="0.5"/>
    </filter>

    <!-- Base de vidro fosco escuro com matiz laranja -->
    <linearGradient id="equip-glass-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1009" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#130A04" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#080301" stop-opacity="0.97"/>
    </linearGradient>

    <!-- Brilho volumétrico interno laranja da placa -->
    <radialGradient id="equip-glass-glow" cx="25%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#C2410C" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>

    <!-- Rim light chanfrado da borda externa -->
    <linearGradient id="equip-rim-border" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFEDD5" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#F97316" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#C2410C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#431407" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Reflexo especular superior do vidro -->
    <linearGradient id="equip-specular-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#FDBA74" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Gradientes 3D do Escudo -->
    <linearGradient id="equip-shield-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="40%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>

    <linearGradient id="equip-shield-rim" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FB923C" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7C2D12" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Gradientes 3D da Engrenagem Central -->
    <linearGradient id="equip-gear-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5"/>
      <stop offset="25%" stop-color="#FB923C"/>
      <stop offset="70%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <linearGradient id="equip-gear-rim" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FED7AA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Máscara estrita para confinar 100% de luz dentro da placa -->
    <clipPath id="equip-plaque-clip">
      <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75"/>
    </clipPath>
  </defs>

  <!-- GRUPO PRINCIPAL CONFINADO NA PLACA -->
  <g clip-path="url(#equip-plaque-clip)">
    <!-- Fundo de vidro fosco escuro -->
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#equip-glass-base)"/>

    <!-- Brilho volumétrico interno laranja -->
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#equip-glass-glow)"/>

    <!-- Reflexo especular diagonal superior -->
    <path d="M 51.2 51.2 L 972.8 51.2 L 972.8 380 L 51.2 580 Z" fill="url(#equip-specular-top)"/>

    <!-- SÍMBOLO RELEVO 3D: ESCUDO COM ENGRENAGEM AO CENTRO -->
    <g id="equip-symbol-group">
      <!-- 1. CORPO DO ESCUDO (BASE SÓLIDA CHANFRADA) -->
      <g filter="url(#equip-shadow-shield)">
        <path d="M 512 188 C 655 188, 762 216, 762 300 C 762 555, 665 735, 512 836 C 359 735, 262 555, 262 300 C 262 216, 369 188, 512 188 Z" 
              fill="url(#equip-shield-grad)" stroke="url(#equip-shield-rim)" stroke-width="9" stroke-linejoin="round"/>
        <!-- Friso de luz no topo do escudo -->
        <path d="M 310 286 C 385 245, 452 232, 512 232 C 572 232, 639 245, 714 286" 
              stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.25" fill="none"/>
      </g>

      <!-- Engrenagem reduzida e centralizada dentro do escudo (ajuste Moked) -->
      <g transform="translate(512 520) scale(0.55) translate(-512 -589)">
      <!-- 2. ENGRENAGEM INDUSTRIAL (8 DENTES) EM ALTO RELEVO 3D -->
      <g filter="url(#equip-shadow-gear)">
        <!-- Engrenagem vazada no centro: dentes definidos + furo interno -->
        <path fill-rule="evenodd" clip-rule="evenodd"
              d="M 548 338 L 476 338 L 471 386 C 452 393, 434 403, 418 416 L 372 398 L 321 449 L 339 495 C 326 511, 316 529, 309 548 L 261 553 L 261 625 L 309 630 C 316 649, 326 667, 339 683 L 321 729 L 372 780 L 418 762 C 434 775, 452 785, 471 792 L 476 840 L 548 840 L 553 792 C 572 785, 590 775, 606 762 L 652 780 L 703 729 L 685 683 C 698 667, 708 649, 715 630 L 763 625 L 763 553 L 715 548 C 708 529, 698 511, 685 495 L 703 449 L 652 398 L 606 416 C 590 403, 572 393, 553 386 Z 
                 M 512 514 C 553.5 514, 587 547.5, 587 589 C 587 630.5, 553.5 664, 512 664 C 470.5 664, 437 630.5, 437 589 C 437 547.5, 470.5 514, 512 514 Z"
              fill="url(#equip-gear-grad)" stroke="url(#equip-gear-rim)" stroke-width="7" stroke-linejoin="round"/>
        <!-- Reflexo suave no chanfro superior da engrenagem -->
        <circle cx="512" cy="589" r="115" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="140 300" opacity="0.35"/>
      </g>

      <!-- 3. DETALHE SECUNDÁRIO CINZA-AZULADO (EIXO CENTRAL) -->
      <circle cx="512" cy="589" r="42" fill="#1E293B" stroke="#94A3B8" stroke-width="5"/>
      <circle cx="512" cy="589" r="14" fill="#F97316" opacity="0.85"/>
      </g>
    </g>

    <!-- Friso de luz interno no bisel superior -->
    <rect x="55.2" y="55.2" width="913.6" height="913.6" rx="198.75" ry="198.75" 
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.25"/>
  </g>

  <!-- BORDA DE LUZ EXTERNA (RIM LIGHT DA PLACA) - ZERO VAZAMENTO -->
  <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75" 
        fill="none" stroke="url(#equip-rim-border)" stroke-width="7"/>
</svg>
