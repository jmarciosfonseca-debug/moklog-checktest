<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filtros de relevo 3D e profundidade -->
    <filter id="peri-shadow-fence" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="16" stdDeviation="15" flood-color="#021B18" flood-opacity="0.88"/>
    </filter>

    <filter id="peri-shadow-runner" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="14" stdDeviation="12" flood-color="#01100E" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#2DD4BF" flood-opacity="0.5"/>
    </filter>

    <!-- Base de vidro fosco escuro com matiz turquesa -->
    <linearGradient id="peri-glass-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1D1A" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#051714" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#020B0A" stop-opacity="0.97"/>
    </linearGradient>

    <!-- Brilho volumétrico interno turquesa da placa -->
    <radialGradient id="peri-glass-glow" cx="25%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#0F766E" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>

    <!-- Rim light chanfrado da borda externa -->
    <linearGradient id="peri-rim-border" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#CCFBF1" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#2DD4BF" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#0F766E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#115E59" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Reflexo especular superior do vidro -->
    <linearGradient id="peri-specular-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#99F6E4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Gradientes 3D do Traçado Perimetral (Cerca/Muralha) -->
    <linearGradient id="peri-fence-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="50%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#134E4A"/>
    </linearGradient>

    <linearGradient id="peri-fence-rim" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#F0FDFA" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#5EEAD4" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#115E59" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Gradientes 3D da Figura Humana Tática em Movimento -->
    <linearGradient id="peri-runner-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#F0FDFA"/>
      <stop offset="30%" stop-color="#5EEAD4"/>
      <stop offset="70%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>

    <!-- Máscara estrita para confinar 100% de luz dentro da placa -->
    <clipPath id="peri-plaque-clip">
      <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75"/>
    </clipPath>
  </defs>

  <!-- GRUPO PRINCIPAL CONFINADO NA PLACA -->
  <g clip-path="url(#peri-plaque-clip)">
    <!-- Fundo de vidro fosco escuro -->
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#peri-glass-base)"/>

    <!-- Brilho volumétrico interno turquesa -->
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#peri-glass-glow)"/>

    <!-- Reflexo especular diagonal superior -->
    <path d="M 51.2 51.2 L 972.8 51.2 L 972.8 380 L 51.2 580 Z" fill="url(#peri-specular-top)"/>

    <!-- SÍMBOLO RELEVO 3D: RONDA PERIMETRAL -->
    <g id="peri-symbol-group">
      <!-- 1. CONTORNO DO PERÍMETRO (CERCA TÁTICA ISOMÉTRICA EM RELEVO 3D) -->
      <g filter="url(#peri-shadow-fence)">
        <!-- Linha Perimetral Contínua com Chanfro -->
        <polygon points="512,185 780,335 780,685 512,835 244,685 244,335" 
                 fill="none" stroke="url(#peri-fence-grad)" stroke-width="26" stroke-linejoin="round"/>
        <polygon points="512,185 780,335 780,685 512,835 244,685 244,335" 
                 fill="none" stroke="url(#peri-fence-rim)" stroke-width="8" stroke-linejoin="round"/>
      </g>

      <!-- Postes/Sensores do Perímetro nos Vértices (Detalhes Secundários em Cinza-Azulado) -->
      <circle cx="512" cy="185" r="14" fill="#334155" stroke="#94A3B8" stroke-width="4"/>
      <circle cx="780" cy="335" r="14" fill="#334155" stroke="#94A3B8" stroke-width="4"/>
      <circle cx="780" cy="685" r="14" fill="#334155" stroke="#94A3B8" stroke-width="4"/>
      <circle cx="512" cy="835" r="14" fill="#334155" stroke="#94A3B8" stroke-width="4"/>
      <circle cx="244" cy="685" r="14" fill="#334155" stroke="#94A3B8" stroke-width="4"/>
      <circle cx="244" cy="335" r="14" fill="#334155" stroke="#94A3B8" stroke-width="4"/>

      <!-- 2. FIGURA HUMANA EM MOVIMENTO (TOTALMENTE CONTIDA DENTRO DO PERÍMETRO) -->
      <g filter="url(#peri-shadow-runner)">
        <!-- Cabeça com capacete/boné tático -->
        <circle cx="535" cy="365" r="46" fill="url(#peri-runner-grad)" stroke="#FFFFFF" stroke-width="4"/>

        <!-- Tronco e Membros em Silhueta Dinâmica de Ronda (Passo Largo) -->
        <!-- Braço Traseiro -->
        <path d="M 495 440 L 440 480 L 420 535" 
              fill="none" stroke="url(#peri-runner-grad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Tronco Inclinado -->
        <path d="M 525 420 L 490 560" 
              fill="none" stroke="url(#peri-runner-grad)" stroke-width="32" stroke-linecap="round"/>

        <!-- Perna Traseira -->
        <path d="M 490 560 L 430 635 L 395 700" 
              fill="none" stroke="url(#peri-runner-grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Braço Dianteiro -->
        <path d="M 525 440 L 580 475 L 630 455" 
              fill="none" stroke="url(#peri-runner-grad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Perna Dianteira em Avanço -->
        <path d="M 490 560 L 565 625 L 610 705" 
              fill="none" stroke="url(#peri-runner-grad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Friso de luz interno no bisel superior -->
    <rect x="55.2" y="55.2" width="913.6" height="913.6" rx="198.75" ry="198.75" 
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.25"/>
  </g>

  <!-- BORDA DE LUZ EXTERNA (RIM LIGHT DA PLACA) - ZERO VAZAMENTO -->
  <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75" 
        fill="none" stroke="url(#peri-rim-border)" stroke-width="7"/>
</svg>
