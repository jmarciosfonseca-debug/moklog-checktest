<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filtros de relevo 3D e profundidade -->
    <filter id="emp-shadow-tower" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="16" stdDeviation="15" flood-color="#140224" flood-opacity="0.88"/>
    </filter>

    <filter id="emp-windows-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#C084FC" flood-opacity="0.6"/>
      <feDropShadow dx="-4" dy="8" stdDeviation="6" flood-color="#090112" flood-opacity="0.9"/>
    </filter>

    <!-- Base de vidro fosco escuro com matiz roxo -->
    <linearGradient id="emp-glass-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180C26" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#10061B" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#07020C" stop-opacity="0.97"/>
    </linearGradient>

    <!-- Brilho volumétrico interno roxo da placa -->
    <radialGradient id="emp-glass-glow" cx="25%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#7E22CE" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <!-- Rim light chanfrado da borda externa -->
    <linearGradient id="emp-rim-border" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#F3E8FF" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#A855F7" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#7E22CE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B0764" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Reflexo especular superior do vidro -->
    <linearGradient id="emp-specular-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#D8B4FE" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Gradientes 3D do Edifício Corporativo Central -->
    <linearGradient id="emp-tower-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="40%" stop-color="#6B21A8"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>

    <linearGradient id="emp-tower-rim" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#C084FC" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#581C87" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Gradiente 3D das Janelas Iluminadas -->
    <linearGradient id="emp-window-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F3E8FF"/>
      <stop offset="80%" stop-color="#D8B4FE"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Máscara estrita para confinar 100% de luz dentro da placa -->
    <clipPath id="emp-plaque-clip">
      <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75"/>
    </clipPath>
  </defs>

  <!-- GRUPO PRINCIPAL CONFINADO NA PLACA -->
  <g clip-path="url(#emp-plaque-clip)">
    <!-- Fundo de vidro fosco escuro -->
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#emp-glass-base)"/>

    <!-- Brilho volumétrico interno roxo -->
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#emp-glass-glow)"/>

    <!-- Reflexo especular diagonal superior -->
    <path d="M 51.2 51.2 L 972.8 51.2 L 972.8 380 L 51.2 580 Z" fill="url(#emp-specular-top)"/>

    <!-- SÍMBOLO RELEVO 3D: PRÉDIO COMERCIAL COM JANELAS ILUMINADAS -->
    <g id="emp-symbol-group">
      <!-- 1. CORPO PRINCIPAL DA TORRE COMERCIAL (BLOCO CENTRAL SÓLIDO) -->
      <g filter="url(#emp-shadow-tower)">
        <rect x="312" y="210" width="400" height="610" rx="28" ry="28" 
              fill="url(#emp-tower-grad)" stroke="url(#emp-tower-rim)" stroke-width="8"/>
        <!-- Platibanda / topo iluminado -->
        <rect x="328" y="224" width="368" height="28" rx="10" ry="10" 
              fill="#FFFFFF" opacity="0.22"/>
      </g>

      <!-- 2. MATRIZ DE JANELAS ILUMINADAS (RELEVO INTERNO 3D, TOTALMENTE CONTIDO) -->
      <g filter="url(#emp-windows-glow)">
        <!-- Fileira 1 -->
        <rect x="372" y="295" width="76" height="58" rx="10" ry="10" fill="url(#emp-window-grad)"/>
        <rect x="474" y="295" width="76" height="58" rx="10" ry="10" fill="url(#emp-window-grad)"/>
        <rect x="576" y="295" width="76" height="58" rx="10" ry="10" fill="url(#emp-window-grad)"/>

        <!-- Fileira 2 -->
        <rect x="372" y="385" width="76" height="58" rx="10" ry="10" fill="url(#emp-window-grad)"/>
        <rect x="474" y="385" width="76" height="58" rx="10" ry="10" fill="url(#emp-window-grad)"/>
        <rect x="576" y="385" width="76" height="58" rx="10" ry="10" fill="url(#emp-window-grad)"/>

        <!-- Fileira 3 -->
        <rect x="372" y="475" width="76" height="58" rx="10" ry="10" fill="url(#emp-window-grad)"/>
        <rect x="474" y="475" width="76" height="58" rx="10" ry="10" fill="url(#emp-window-grad)"/>
        <rect x="576" y="475" width="76" height="58" rx="10" ry="10" fill="url(#emp-window-grad)"/>

        <!-- Fileira 4 -->
        <rect x="372" y="565" width="76" height="58" rx="10" ry="10" fill="url(#emp-window-grad)"/>
        <rect x="474" y="565" width="76" height="58" rx="10" ry="10" fill="url(#emp-window-grad)"/>
        <rect x="576" y="565" width="76" height="58" rx="10" ry="10" fill="url(#emp-window-grad)"/>
      </g>

      <!-- 3. PORTAL TÉRREO / ENTRADA (DETALHE SECUNDÁRIO CINZA-AZULADO CONTIDO) -->
      <rect x="462" y="675" width="100" height="137" rx="12" ry="12" 
            fill="#1E293B" stroke="#94A3B8" stroke-width="5"/>
      <!-- Eixo central da porta de vidro -->
      <line x1="512" y1="685" x2="512" y2="805" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
      <circle cx="494" cy="745" r="4" fill="#C084FC"/>
      <circle cx="530" cy="745" r="4" fill="#C084FC"/>
    </g>

    <!-- Friso de luz interno no bisel superior -->
    <rect x="55.2" y="55.2" width="913.6" height="913.6" rx="198.75" ry="198.75" 
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.25"/>
  </g>

  <!-- BORDA DE LUZ EXTERNA (RIM LIGHT DA PLACA) - ZERO VAZAMENTO -->
  <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75" 
        fill="none" stroke="url(#emp-rim-border)" stroke-width="7"/>
</svg>
