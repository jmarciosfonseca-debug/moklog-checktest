<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filtros de relevo 3D e profundidade -->
    <filter id="prestA-shadow-main" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="16" stdDeviation="15" flood-color="#140224" flood-opacity="0.88"/>
    </filter>

    <filter id="prestA-shadow-seal" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-6" dy="12" stdDeviation="10" flood-color="#090112" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#C084FC" flood-opacity="0.5"/>
    </filter>

    <!-- Base de vidro fosco escuro com matiz roxo -->
    <linearGradient id="prestA-glass-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180C26" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#10061B" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#07020C" stop-opacity="0.97"/>
    </linearGradient>

    <!-- Brilho volumétrico interno roxo da placa -->
    <radialGradient id="prestA-glass-glow" cx="25%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#7E22CE" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <!-- Rim light chanfrado da borda externa -->
    <linearGradient id="prestA-rim-border" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#F3E8FF" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#A855F7" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#7E22CE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B0764" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Reflexo especular superior do vidro -->
    <linearGradient id="prestA-specular-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#D8B4FE" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Gradientes da Maleta Executiva -->
    <linearGradient id="prestA-case-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="35%" stop-color="#7E22CE"/>
      <stop offset="75%" stop-color="#6B21A8"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>

    <linearGradient id="prestA-case-rim" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#C084FC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#581C87" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Gradiente da Chave Inglesa (Manutenção Técnica) -->
    <linearGradient id="prestA-wrench-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="40%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Gradiente do Selo/Escudo Central -->
    <linearGradient id="prestA-seal-grad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E9D5FF"/>
      <stop offset="70%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <!-- Máscara estrita para confinar 100% de luz dentro da placa -->
    <clipPath id="prestA-plaque-clip">
      <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75"/>
    </clipPath>
  </defs>

  <!-- GRUPO PRINCIPAL CONFINADO NA PLACA -->
  <g clip-path="url(#prestA-plaque-clip)">
    <!-- Fundo de vidro fosco escuro -->
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#prestA-glass-base)"/>

    <!-- Brilho volumétrico interno roxo -->
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#prestA-glass-glow)"/>

    <!-- Reflexo especular diagonal superior -->
    <path d="M 51.2 51.2 L 972.8 51.2 L 972.8 380 L 51.2 580 Z" fill="url(#prestA-specular-top)"/>

    <!-- SÍMBOLO RELEVO 3D: MALETA COM CHAVE CRUZADA E SELO -->
    <g id="prestA-symbol-group">
      <!-- 2. CORPO DA MALETA EXECUTIVA (BRIEFCASE HORIZONTAL 3D) -->
      <g filter="url(#prestA-shadow-main)">
        <!-- Alça da maleta -->
        <path d="M 420 375 L 420 310 C 420 285, 440 265, 465 265 L 559 265 C 584 265, 604 285, 604 310 L 604 375" 
              fill="none" stroke="#FAF5FF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Maleta principal com cantos arredondados -->
        <rect x="232" y="375" width="560" height="390" rx="36" ry="36" 
              fill="url(#prestA-case-grad)" stroke="url(#prestA-case-rim)" stroke-width="9"/>
        <!-- Friso superior iluminado da tampa -->
        <rect x="252" y="390" width="520" height="26" rx="10" ry="10" 
              fill="#FFFFFF" opacity="0.22"/>
        <!-- Divisão horizontal das abas da maleta -->
        <line x1="235" y1="520" x2="789" y2="520" stroke="#3B0764" stroke-width="8"/>
        <!-- Fechos metálicos de trava -->
        <rect x="330" y="495" width="46" height="50" rx="8" ry="8" fill="#1E293B" stroke="#94A3B8" stroke-width="4"/>
        <rect x="648" y="495" width="46" height="50" rx="8" ry="8" fill="#1E293B" stroke="#94A3B8" stroke-width="4"/>
      </g>

      <!-- 3. SELO / ESCUDO CENTRAL DE HOMOLOGAÇÃO COM CHECK -->
      <g filter="url(#prestA-shadow-seal)">
        <!-- Escudo central sobre a maleta -->
        <path d="M 512 430 C 580 430, 625 450, 625 500 C 625 615, 570 680, 512 715 C 454 680, 399 615, 399 500 C 399 450, 444 430, 512 430 Z" 
              fill="url(#prestA-seal-grad)" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
        <!-- Check de conformidade interno -->
        <path d="M 470 565 L 500 595 L 565 525" 
              fill="none" stroke="#3B0764" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Friso de luz interno no bisel superior -->
    <rect x="55.2" y="55.2" width="913.6" height="913.6" rx="198.75" ry="198.75" 
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.25"/>
  </g>

  <!-- BORDA DE LUZ EXTERNA (RIM LIGHT DA PLACA) - ZERO VAZAMENTO -->
  <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75" 
        fill="none" stroke="url(#prestA-rim-border)" stroke-width="7"/>
</svg>
