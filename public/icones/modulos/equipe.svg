<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filtros de relevo e sombra interna contida -->
    <filter id="equipe-shadow-back" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="16" stdDeviation="14" flood-color="#021329" flood-opacity="0.8"/>
    </filter>

    <filter id="equipe-shadow-front" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-10" dy="20" stdDeviation="16" flood-color="#010A14" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#0EA5E9" flood-opacity="0.45"/>
    </filter>

    <!-- Gradiente base da placa de vidro fosco escuro -->
    <linearGradient id="equipe-glass-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.94"/>
      <stop offset="40%" stop-color="#0B132B" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.96"/>
    </linearGradient>

    <!-- Brilho interno volumétrico ciano/azul da placa -->
    <radialGradient id="equipe-glass-glow" cx="25%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#0284C7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>

    <!-- Rim light chanfrado da borda externa -->
    <linearGradient id="equipe-rim-border" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#0EA5E9" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#0369A1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0C4A6E" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Reflexo especular superior do vidro -->
    <linearGradient id="equipe-specular-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Gradientes 3D - Vigilante Secundário (Atrás) -->
    <linearGradient id="equipe-body-back" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="equipe-rim-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Gradientes 3D - Vigilante Líder (Frente) -->
    <linearGradient id="equipe-body-front" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#0284C7"/>
      <stop offset="75%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#082F49"/>
    </linearGradient>

    <linearGradient id="equipe-rim-front" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" stop-opacity="1"/>
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#0EA5E9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Máscara estrita para confinar 100% de luz dentro da placa de cantos arredondados -->
    <clipPath id="equipe-plaque-clip">
      <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75"/>
    </clipPath>
  </defs>

  <!-- GRUPO PRINCIPAL: CONFINADO ESTRITAMENTE À ÁREA DA PLACA -->
  <g clip-path="url(#equipe-plaque-clip)">
    <!-- Massa sólida da placa de vidro -->
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#equipe-glass-base)"/>

    <!-- Brilho volumétrico interno -->
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#equipe-glass-glow)"/>

    <!-- Reflexo especular diagonal superior (luz do alto à esquerda) -->
    <path d="M 51.2 51.2 L 972.8 51.2 L 972.8 380 L 51.2 580 Z" fill="url(#equipe-specular-top)"/>

    <!-- SÍMBOLO RELEVO 3D -->
    <g id="equipe-symbol-group">
      <!-- 1. VIGILANTE DE FUNDO (SECUNDÁRIO / OMBRO DIREITO) -->
      <g filter="url(#equipe-shadow-back)">
        <!-- Cabeça -->
        <circle cx="630" cy="385" r="92" fill="url(#equipe-body-back)" stroke="url(#equipe-rim-back)" stroke-width="8"/>
        <!-- Ombro / Tronco tático chanfrado -->
        <path d="M 470 735 C 475 580, 535 525, 630 525 C 725 525, 785 580, 790 735 Z" 
              fill="url(#equipe-body-back)" stroke="url(#equipe-rim-back)" stroke-width="8" stroke-linejoin="round"/>
        <!-- Destaque de lapela/acessório cinza-azulado -->
        <path d="M 630 525 L 630 670" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
      </g>

      <!-- 2. VIGILANTE DA FRENTE (LÍDER OPERACIONAL / DESTAQUE) -->
      <g filter="url(#equipe-shadow-front)">
        <!-- Cabeça e Queixo Tático -->
        <circle cx="430" cy="430" r="105" fill="url(#equipe-body-front)" stroke="url(#equipe-rim-front)" stroke-width="9"/>
        <!-- Reflexo especular na cabeça -->
        <ellipse cx="395" cy="375" rx="38" ry="22" fill="#FFFFFF" opacity="0.32" transform="rotate(-30 395 375)"/>

        <!-- Tronco tático robusto em relevo -->
        <path d="M 235 815 C 245 630, 315 570, 430 570 C 545 570, 615 630, 625 815 Z" 
              fill="url(#equipe-body-front)" stroke="url(#equipe-rim-front)" stroke-width="9" stroke-linejoin="round"/>

        <!-- Nervura central e detalhes de ombreira tática -->
        <path d="M 430 572 L 430 812" stroke="#BAE6FD" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
        <path d="M 320 635 L 400 685" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
        <path d="M 540 635 L 460 685" stroke="#0369A1" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
      </g>
    </g>

    <!-- Friso de luz interno no bisel superior -->
    <rect x="55.2" y="55.2" width="913.6" height="913.6" rx="198.75" ry="198.75" 
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.25"/>
  </g>

  <!-- BORDA DE LUZ EXTERNA (RIM LIGHT DA PLACA) - ZERO VAZAMENTO -->
  <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75" 
        fill="none" stroke="url(#equipe-rim-border)" stroke-width="7"/>
</svg>
