<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="card-klog-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="16" stdDeviation="15" flood-color="#02091A" flood-opacity="0.92"/>
    </filter>

    <filter id="card-klog-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#38BDF8" flood-opacity="0.75"/>
    </filter>

    <!-- Base de vidro fosco em azul-noite profundo -->
    <linearGradient id="card-klog-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1832" stop-opacity="0.96"/>
      <stop offset="45%" stop-color="#061024" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#020612" stop-opacity="0.98"/>
    </linearGradient>

    <radialGradient id="card-klog-glow-in" cx="22%" cy="18%" r="75%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="#1D4ED8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0A1832" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="card-klog-rim" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#DBEAFE" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#3B82F6" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#1D4ED8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="card-klog-specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#93C5FD" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Gradientes do Monumento KLOG -->
    <linearGradient id="card-klog-monolith" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <clipPath id="card-klog-clip">
      <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-klog-clip)">
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#card-klog-base)"/>
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#card-klog-glow-in)"/>
    <path d="M 51.2 51.2 L 972.8 51.2 L 972.8 380 L 51.2 580 Z" fill="url(#card-klog-specular)"/>
<g transform="translate(512 512) scale(1.28) translate(-512 -410)">

    <!-- RADAR E ESCUDO DE CONTROLO DE ACESSO -->
    <circle cx="512" cy="430" r="220" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="12 6" opacity="0.3"/>
    <line x1="512" y1="210" x2="512" y2="650" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.25"/>

    <!-- MONUMENTO ESTRUTURAL KLOG 3D (COM O CORTE ANGULAR OFICIAL) -->
    <g filter="url(#card-klog-shadow)">
      <!-- Base Inferior Azul-Escura -->
      <polygon points="210,610 210,480 340,480 814,480 814,610" 
               fill="#0F172A" stroke="#3B82F6" stroke-width="4"/>
      <!-- Painel Superior com Chanfro Diagonal KLOG -->
      <polygon points="210,310 814,310 814,480 340,480 210,380" 
               fill="#F8FAFC" stroke="#FFFFFF" stroke-width="4"/>
      <!-- Bloco Chanfrado Azul da Esquerda -->
      <polygon points="210,310 340,310 340,480 210,380" 
               fill="url(#card-klog-monolith)"/>

      <!-- Letras KLOG em Relevo Escuro -->
      <text x="540" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="900" 
            fill="#0F2A4A" letter-spacing="6" text-anchor="middle">KLOG</text>
    </g>

    <!-- SENSOR ÓPTICO DE VIGILÂNCIA MOKED -->
    <g filter="url(#card-klog-glow)">
      <circle cx="512" cy="270" r="18" fill="#0284C7" stroke="#BAE6FD" stroke-width="4"/>
      <circle cx="512" cy="270" r="8" fill="#FFFFFF"/>
      <line x1="512" y1="210" x2="512" y2="250" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    </g>

    </g>
<rect x="55.2" y="55.2" width="913.6" height="913.6" rx="198.75" ry="198.75" 
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.25"/>
  </g>

  <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75" 
        fill="none" stroke="url(#card-klog-rim)" stroke-width="7"/>
</svg>
