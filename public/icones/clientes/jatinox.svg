<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="jat3-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="16" stdDeviation="15" flood-color="#160202" flood-opacity="0.92"/>
    </filter>
    <filter id="jat3-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#EF4444" flood-opacity="0.8"/>
    </filter>

    <linearGradient id="jat3-glass-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180A0C" stop-opacity="0.96"/>
      <stop offset="45%" stop-color="#100507" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#080102" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="jat3-glass-glow" cx="22%" cy="18%" r="75%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#B91C1C" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#180A0C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jat3-rim-border" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FEE2E2" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#EF4444" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#B91C1C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#450A0A" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="jat3-specular-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#FCA5A5" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Aço Inox Superior Jatinox -->
    <linearGradient id="jat3-steel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#CBD5E1"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Vermelho Oficial Jatinox -->
    <linearGradient id="jat3-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="40%" stop-color="#DC2626"/>
      <stop offset="80%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>

    <clipPath id="jat3-plaque-clip">
      <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75"/>
    </clipPath>
  </defs>

  <g clip-path="url(#jat3-plaque-clip)">
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#jat3-glass-base)"/>
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#jat3-glass-glow)"/>
    <path d="M 51.2 51.2 L 972.8 51.2 L 972.8 380 L 51.2 580 Z" fill="url(#jat3-specular-top)"/>
<g transform="translate(512 512) scale(1.28) translate(-512 -410)">

    <!-- Retícula Tática Moked ao fundo -->
    <circle cx="512" cy="400" r="230" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.3"/>
    <line x1="512" y1="170" x2="512" y2="630" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.25"/>
    <line x1="262" y1="400" x2="762" y2="400" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.25"/>

    <!-- SÍMBOLO ORIGINAL JATINOX (LOSANGO BIPARTIDO FIEL) -->
    <g filter="url(#jat3-shadow)">
      <!-- Metade Superior: Aço Inoxidável Cirúrgico (Cinza) -->
      <path d="M 512 210 C 500 210, 480 220, 465 240 L 405 320 L 610 320 L 545 220 C 535 210, 524 210, 512 210 Z" 
            fill="url(#jat3-steel-grad)" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="630,320 835,320 680,240" 
               fill="url(#jat3-steel-grad)" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>

      <!-- Haste Central do Logotipo: JATINOX -->
      <rect x="180" y="340" width="664" height="120" rx="16" ry="16" 
            fill="#0F172A" stroke="#334155" stroke-width="3"/>
      <text x="512" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" 
            fill="#38BDF8" stroke="#1E293B" stroke-width="2" letter-spacing="8" text-anchor="middle">JATINOX</text>

      <!-- Metade Inferior: Vermelho Industrial -->
      <polygon points="394,480 600,480 445,560" 
               fill="url(#jat3-red-grad)" stroke="#FCA5A5" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 620,480 L 780,480 C 800,480, 810,490, 800,510 L 735,590 C 720,610, 700,610, 685,590 L 620,480 Z" 
            fill="url(#jat3-red-grad)" stroke="#FCA5A5" stroke-width="3" stroke-linejoin="round"/>
    </g>

    <!-- Ponto Focal Laser Moked -->
    <circle cx="512" cy="400" r="10" fill="#FFFFFF" filter="url(#jat3-glow)"/>

    </g>
<!-- Friso Interno -->
    <rect x="55.2" y="55.2" width="913.6" height="913.6" rx="198.75" ry="198.75" 
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.25"/>
  </g>

  <!-- Borda Externa Rim Light Completa -->
  <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75" 
        fill="none" stroke="url(#jat3-rim-border)" stroke-width="7"/>
</svg>
