<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filtros de relevo 3D e emissão de luz -->
    <filter id="mega3-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="16" stdDeviation="15" flood-color="#140500" flood-opacity="0.9"/>
    </filter>
    <filter id="mega3-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#F97316" flood-opacity="0.8"/>
    </filter>

    <!-- Base da placa de vidro escuro Moked -->
    <linearGradient id="mega3-glass-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0F06" stop-opacity="0.96"/>
      <stop offset="45%" stop-color="#120A04" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#080301" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="mega3-glass-glow" cx="22%" cy="18%" r="75%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#EA580C" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1A0F06" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mega3-rim-border" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFEDD5" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#FB923C" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#C2410C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#431407" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="mega3-specular-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#FDBA74" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Laranja Oficial Capital Realty / Mega -->
    <linearGradient id="mega3-orange-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="35%" stop-color="#F97316"/>
      <stop offset="70%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>

    <clipPath id="mega3-plaque-clip">
      <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75"/>
    </clipPath>
  </defs>

  <g clip-path="url(#mega3-plaque-clip)">
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#mega3-glass-base)"/>
    <rect x="51.2" y="51.2" width="921.6" height="921.6" fill="url(#mega3-glass-glow)"/>
    <path d="M 51.2 51.2 L 972.8 51.2 L 972.8 380 L 51.2 580 Z" fill="url(#mega3-specular-top)"/>
<g transform="translate(512 512) scale(1.28) translate(-512 -430)">

    <!-- Retícula Tática Moked ao fundo -->
    <circle cx="512" cy="400" r="220" fill="none" stroke="#C2410C" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.3"/>
    <line x1="512" y1="180" x2="512" y2="620" stroke="#F97316" stroke-width="1.5" stroke-opacity="0.25"/>
    <line x1="292" y1="400" x2="732" y2="400" stroke="#F97316" stroke-width="1.5" stroke-opacity="0.25"/>

    <!-- LOGOTIPO OFICIAL MEGA (O "M" ARQUITETÔNICO EM RELEVO 3D) -->
    <g filter="url(#mega3-shadow)">
      <path d="M 280 560 
               L 280 280 
               L 365 240 
               L 512 435 
               L 659 240 
               L 744 280 
               L 744 560 
               L 650 560 
               L 650 380 
               L 512 535 
               L 374 380 
               L 374 560 Z" 
            fill="url(#mega3-orange-grad)" stroke="#FED7AA" stroke-width="6" stroke-linejoin="round"/>
      
      <!-- Linha de Brilho no Chanfro Superior -->
      <path d="M 285 285 L 365 245 L 512 435 L 659 245 L 739 285" 
            fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- Subtítulo Oficial da Marca: CENTRO LOGÍSTICO -->
    <text x="512" y="615" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" 
          fill="#FED7AA" letter-spacing="10" text-anchor="middle">CENTRO LOGÍSTICO</text>

    <!-- Ponto Focal Laser Moked -->
    <circle cx="512" cy="435" r="10" fill="#FFFFFF" filter="url(#mega3-glow)"/>

    </g>
<!-- Friso Interno de Luz -->
    <rect x="55.2" y="55.2" width="913.6" height="913.6" rx="198.75" ry="198.75" 
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.25"/>
  </g>

  <!-- Borda Externa Rim Light Completa -->
  <rect x="51.2" y="51.2" width="921.6" height="921.6" rx="202.75" ry="202.75" 
        fill="none" stroke="url(#mega3-rim-border)" stroke-width="7"/>
</svg>
